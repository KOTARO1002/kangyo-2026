<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="description" content="管理業務主任者試験（2026年12月6日）対策 全22週プログラム">
<meta name="theme-color" content="#FBFAF6">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="管業2026">
<link rel="apple-touch-icon" href="icon.svg">
<title>管理業務主任者 2026｜22週間 合格プログラム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFAF6;
  --card:#FFFFFF;
  --ink:#1C2030;
  --ink-soft:#4A5163;
  --ink-mute:#8E8878;
  --indigo:#27386B;
  --indigo-wash:#EDF1F8;
  --shu:#B93B25;
  --shu-wash:#FBEFEC;
  --rule:#DEDACD;
  --rule-soft:#EBE7DC;
  --ok:#1F6B4D;
  --ok-wash:#EAF3EE;
  --mincho:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
  --gothic:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --mono:"SFMono-Regular",Consolas,"Roboto Mono",monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--gothic);font-size:16px;line-height:1.9;letter-spacing:.01em}
.wrap{max-width:860px;margin:0 auto;padding:0 20px 110px}
a{color:var(--indigo)}

/* ===== topbar ===== */
.topbar{
  position:sticky;top:0;z-index:60;background:rgba(251,250,246,.96);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);
}
.topbar-in{max-width:860px;margin:0 auto;padding:9px 20px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--mincho);font-weight:700;font-size:15px;letter-spacing:.04em;cursor:pointer;white-space:nowrap}
.brand span{color:var(--shu)}
.topbar .sp{flex:1}
.tb-btn{
  font-family:inherit;font-size:12px;background:none;border:1px solid var(--rule);
  color:var(--ink-soft);padding:5px 11px;border-radius:2px;cursor:pointer;white-space:nowrap;
}
.tb-btn:hover{border-color:var(--indigo);color:var(--indigo)}
.tb-cd{font-family:var(--mono);font-size:12px;color:var(--shu);font-weight:700;white-space:nowrap}

/* ===== hero ===== */
.hero{padding:44px 0 30px;border-bottom:1px solid var(--rule);margin-bottom:8px}
.eyebrow{font-size:11px;letter-spacing:.22em;color:var(--shu);font-weight:700;margin:0 0 14px}
h1{font-family:var(--mincho);font-size:clamp(27px,6.4vw,42px);line-height:1.32;font-weight:700;margin:0;letter-spacing:.02em}
h1 .sub{display:block;font-size:clamp(14px,3.4vw,19px);color:var(--indigo);margin-top:12px;font-weight:500}
.hero-lede{margin:22px 0 0;font-size:14.5px;color:var(--ink-soft);max-width:640px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:1px;background:var(--rule-soft);border:1px solid var(--rule-soft);margin-top:26px}
.stat{background:#fff;padding:13px 14px}
.stat .k{font-size:10.5px;letter-spacing:.12em;color:var(--ink-mute);margin-bottom:3px}
.stat .v{font-family:var(--mincho);font-size:20px;font-weight:700;line-height:1.3}
.stat .v small{font-size:12px;font-weight:500;color:var(--ink-soft)}
.stat.hot .v{color:var(--shu)}

/* ===== section ===== */
section{margin:52px 0 0}
h2{font-family:var(--mincho);font-size:22px;font-weight:700;margin:0 0 4px;display:flex;align-items:center;gap:12px;letter-spacing:.04em}
h2::before{content:"";width:22px;height:2px;background:var(--shu);flex:none}
h3.sub-h{font-family:var(--mincho);font-size:17px;margin:30px 0 14px;color:var(--indigo);letter-spacing:.03em}
.lede{color:var(--ink-soft);font-size:14px;margin:0 0 24px;padding-left:34px}
.hint{font-size:12.5px;color:var(--ink-mute);margin:0 0 16px;padding-left:34px}

/* ===== alert ===== */
.alert{background:var(--shu-wash);border:1px solid #F1DCD7;border-left:3px solid var(--shu);padding:18px 20px;margin:24px 0}
.alert h4{font-family:var(--mincho);font-size:16px;margin:0 0 8px;color:#8B2D1C}
.alert p{margin:0;font-size:14px;line-height:1.9;color:#7E3325}
.alert p+p{margin-top:9px}
.alert b{color:#8B2D1C}

/* ===== tables ===== */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff;margin-top:12px}
.tbl th,.tbl td{border:1px solid var(--rule-soft);padding:9px 11px;text-align:left;vertical-align:top}
.tbl th{background:var(--indigo-wash);color:var(--indigo);font-weight:700;white-space:nowrap}
.tbl td b{color:var(--ink)}

/* ===== week index ===== */
.weeks{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.wk{
  background:#fff;border:1px solid var(--rule-soft);border-left:4px solid var(--indigo);
  padding:14px 16px;cursor:pointer;text-align:left;font-family:inherit;color:inherit;
  transition:.16s;position:relative;
}
.wk:hover{box-shadow:0 3px 12px rgba(30,40,70,.06);border-color:var(--rule);transform:translateY(-1px)}
.wk:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.wk .r1{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.wk .num{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink-mute)}
.wk .fld{font-size:10.5px;font-weight:700;letter-spacing:.05em;padding:1px 7px;border-radius:2px}
.wk .ttl{font-family:var(--mincho);font-size:15.5px;font-weight:700;line-height:1.5}
.wk .sub{font-size:12px;color:var(--ink-soft);margin-top:5px;line-height:1.7}
.wk .pb{height:3px;background:var(--rule-soft);margin-top:11px;border-radius:2px;overflow:hidden}
.wk .pb i{display:block;height:100%;width:0;background:var(--ok)}
.wk .pct{position:absolute;top:13px;right:14px;font-family:var(--mono);font-size:10.5px;color:var(--ok);font-weight:700}
.wk .rev{margin-left:6px;font-size:10px;color:var(--shu);border:1px solid #F1DCD7;background:var(--shu-wash);padding:0 5px;border-radius:2px;font-weight:700}

/* ===== week page ===== */
.wk-head{padding:34px 0 22px;border-bottom:1px solid var(--rule)}
.wk-head .kicker{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.wk-head h1{font-size:clamp(23px,5.4vw,33px)}
.badge-fld{font-size:11px;font-weight:700;letter-spacing:.06em;padding:2px 10px;border-radius:2px}
.crumb{font-family:var(--mono);font-size:11.5px;color:var(--ink-mute)}

.aim{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.aim li{background:var(--card);border:1px solid var(--rule-soft);border-left:3px solid var(--indigo);padding:15px 17px;font-size:14.5px;line-height:1.85}
.aim li b{color:var(--indigo)}

.arts{display:grid;gap:14px}
.art{background:var(--card);border:1px solid var(--rule-soft);padding:17px 19px 19px;position:relative}
.art::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--rule)}
.art.key::before{background:var(--shu)}
.art-head{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-bottom:10px}
.no{font-family:var(--mono);font-size:12px;color:var(--ink-mute);border:1px solid var(--rule);padding:1px 7px;border-radius:2px}
.art-title{font-family:var(--mincho);font-size:16.5px;font-weight:700;letter-spacing:.03em}
.chip{font-size:11.5px;font-weight:700;letter-spacing:.04em;background:var(--indigo-wash);color:var(--indigo);padding:2px 9px;border-radius:2px;white-space:nowrap}
.chip.shu{background:var(--shu-wash);color:var(--shu)}
.art p{margin:0;font-size:14.5px;line-height:1.9}
.art p+p{margin-top:10px}
.art .warn{margin-top:12px;background:var(--shu-wash);border:1px solid #F1DCD7;padding:10px 13px;font-size:13.5px;color:#8B2D1C;line-height:1.8}
.art .warn b{color:var(--shu)}
mark{background:#FBF3D3;padding:0 3px;border-radius:2px;color:inherit}

/* ===== quiz ===== */
.progress{position:sticky;top:41px;z-index:20;background:rgba(251,250,246,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule);padding:10px 20px;margin:0 -20px 20px;display:flex;align-items:center;gap:13px;font-size:12.5px;color:var(--ink-soft)}
.bar{flex:1;height:5px;background:var(--rule-soft);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--indigo);transition:width .35s ease}
.score{font-family:var(--mono);font-weight:700;color:var(--ink);white-space:nowrap}

.q{background:var(--card);border:1px solid var(--rule-soft);padding:17px 19px;margin-bottom:15px}
.q-head{display:flex;gap:10px;align-items:baseline;margin-bottom:12px}
.q-no{font-family:var(--mono);font-size:12px;font-weight:700;color:#fff;background:var(--indigo);padding:2px 8px;border-radius:2px;flex:none}
.q-no.mc{background:var(--shu)}
.q-text{font-size:15px;line-height:1.85;flex:1}
.ox{display:flex;gap:10px}
.ox button{flex:1;font-family:var(--mincho);font-size:22px;font-weight:700;padding:9px 0;background:#fff;border:1.5px solid var(--rule);color:var(--ink);cursor:pointer;border-radius:3px;transition:.15s}
.ox button:hover{border-color:var(--indigo);background:var(--indigo-wash)}
.ox button:focus-visible,.choices button:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.choices{display:grid;gap:8px}
.choices button{display:flex;gap:11px;text-align:left;align-items:flex-start;background:#fff;border:1.5px solid var(--rule);border-radius:3px;padding:11px 13px;font-family:inherit;font-size:14px;line-height:1.75;color:var(--ink);cursor:pointer;transition:.15s}
.choices button:hover{border-color:var(--indigo);background:var(--indigo-wash)}
.choices .n{font-family:var(--mono);font-weight:700;font-size:12px;color:var(--indigo);border:1px solid var(--rule);border-radius:2px;padding:0 6px;flex:none;margin-top:3px}
button.correct{border-color:var(--ok)!important;background:var(--ok-wash)!important}
button.wrong{border-color:var(--shu)!important;background:var(--shu-wash)!important}
button.dim{opacity:.42}
.q.done button{cursor:default}
.verdict{display:none;margin-top:14px;padding-top:14px;border-top:1px dashed var(--rule)}
.q.done .verdict{display:block}
.verdict-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.badge{font-family:var(--mincho);font-size:14px;font-weight:700;padding:2px 12px;border-radius:2px}
.badge.ok{background:var(--ok-wash);color:var(--ok);border:1px solid #C9E0D4}
.badge.ng{background:var(--shu-wash);color:var(--shu);border:1px solid #F1DCD7}
.ans{font-family:var(--mincho);font-size:15px;font-weight:700;color:var(--indigo)}
.exp{font-size:14px;line-height:1.9;color:var(--ink-soft)}
.exp b{color:var(--ink)}
.result{display:none;margin-top:20px;background:var(--indigo-wash);border:1px solid #D5DEEE;padding:20px;text-align:center}
.result.show{display:block}
.result .big{font-family:var(--mincho);font-size:29px;font-weight:700;color:var(--indigo)}
.result .cmt{font-size:14px;color:var(--ink-soft);margin-top:6px}

/* ===== flashcards ===== */
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(238px,1fr))}
.fc{background:#fff;border:1px solid var(--rule-soft);border-top:3px solid var(--indigo);padding:16px 18px;cursor:pointer;min-height:116px;display:flex;flex-direction:column;justify-content:center;transition:.18s}
.fc:hover{box-shadow:0 2px 10px rgba(30,40,70,.05)}
.fc:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.fc .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--ink-mute);margin-bottom:7px}
.fc .txt{font-size:14.5px;line-height:1.8;font-weight:500}
.fc.flip{border-top-color:var(--shu);background:var(--shu-wash)}
.fc.flip .lbl{color:var(--shu)}
.fc.flip .txt{color:#7E2A1B;font-weight:700}

/* ===== buttons / nav ===== */
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;justify-content:center}
.btn{background:none;border:1px solid var(--rule);color:var(--ink-soft);font-family:inherit;font-size:12.5px;padding:8px 16px;border-radius:2px;cursor:pointer}
.btn:hover{border-color:var(--shu);color:var(--shu)}
.btn.pri{border-color:var(--indigo);color:var(--indigo)}
.btn.pri:hover{background:var(--indigo-wash)}
.pager{display:flex;gap:10px;margin-top:46px;padding-top:22px;border-top:1px solid var(--rule)}
.pager button{flex:1;background:#fff;border:1px solid var(--rule-soft);padding:14px 16px;text-align:left;font-family:inherit;color:inherit;cursor:pointer;transition:.15s}
.pager button:hover{border-color:var(--indigo)}
.pager button:disabled{opacity:.35;cursor:default}
.pager .d{font-family:var(--mono);font-size:10.5px;color:var(--ink-mute);letter-spacing:.1em}
.pager .t{font-family:var(--mincho);font-size:14px;font-weight:700;margin-top:3px;line-height:1.5}
.pager .nx{text-align:right}

footer{margin-top:52px;padding-top:20px;border-top:1px solid var(--rule);font-size:12px;color:var(--ink-mute);line-height:1.9;text-align:center}

@media (max-width:600px){
  body{font-size:15px}
  .wrap{padding:0 16px 90px}
  .progress{margin-left:-16px;margin-right:-16px;padding-left:16px;padding-right:16px}
  .art,.q{padding:15px 16px}
  .lede,.hint{padding-left:0}
  .topbar-in{padding:8px 16px;gap:8px}
  .brand{font-size:13px}
  .tb-btn{padding:5px 9px;font-size:11.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-in">
    <div class="brand" id="brandBtn">管業<span>2026</span> ／ 22週プログラム</div>
    <div class="sp"></div>
    <span class="tb-cd">残 <span id="cd">–</span> 日</span>
    <button class="tb-btn" id="navHome">週一覧</button>
  </div>
</div>

<div class="wrap" id="app"></div>

<script>
var WEEKS = [];

WEEKS.push({
n:1, field:"区分所有法", rev:false,
title:"区分所有法 ①",
sub:"総則・専有部分／共用部分・敷地利用権",
aim:[
"本試験は50問・四肢択一。区分所有法単体で例年<b>6〜9問</b>、標準管理規約と合わせると区分所有法関連だけで<b>15問前後</b>を占める最重要分野（年度により変動あり）。",
"第1週は「総則・専有部分/共用部分・敷地利用権」という土台部分。宅建でも学習済みだが、管業では<b>床面積の算定方法（内法計算）・先取特権の効力・規約共用部分の登記対抗要件</b>など、宅建より一段深い数字と手続の精度が問われる。",
"ここを曖昧にすると第2週（管理者・規約・集会）以降がすべてブレる。<b>定義の正確な暗記に徹する</b>こと。",
"2026年4月施行の改正は主に「集会の決議要件・所在等不明区分所有者・建替え／再生決議」に関するもので、<b>今週の範囲（総則・専有部分・共用部分・敷地利用権の定義自体）に直接の改正はない</b>。改正点は第2〜3週で扱う。"
],
points:[
{t:"区分所有権の成立要件", chip:"1条", hot:"頻出", key:true,
 body:"<p>①<b>構造上の独立性</b>（他の部分と壁等で明確に遮断）と②<b>利用上の独立性</b>（独立して住居・店舗・事務所等の用途に供しうる）の<mark>両方</mark>を満たす建物部分にのみ成立する。</p>",
 warn:"<b>ひっかけ</b>：どちらか一方だけでは専有部分にならない。「構造上区分されていれば足りる」は誤り。"},
{t:"定義", chip:"2条",
 body:"<table class=tbl><tr><th>区分所有者</th><td>専有部分を所有する者</td></tr><tr><th>専有部分</th><td>区分所有権の目的たる建物部分</td></tr><tr><th>共用部分</th><td>専有部分以外の建物部分 ＋ 建物の附属物 ＋ 規約により共用部分とされた附属の建物</td></tr><tr><th>敷地利用権</th><td>専有部分を所有するための建物の敷地に関する権利。<mark>所有権に限らず</mark>地上権・賃借権等の債権も含む</td></tr></table>"},
{t:"区分所有者の団体＝管理組合", chip:"3条", hot:"第2週の土台", key:true,
 body:"<p>区分所有者となれば、<mark>規約の有無にかかわらず「全員で」当然に</mark>団体を構成する。任意加入・任意脱退という概念がなく、区分所有者である限り強制的に構成員となる。</p><p>一部共用部分のみを共用する者だけの団体を、別途構成することも可能。</p>"},
{t:"法定共用部分", chip:"4条1項",
 body:"<p>数個の専有部分に通ずる廊下・階段室・エレベーター等、構造上当然に共用に供される部分。<mark>規約を待たず当然に共用部分</mark>となり、<mark>登記も不要</mark>。</p>"},
{t:"規約共用部分", chip:"4条2項", hot:"対抗要件", key:true,
 body:"<p>管理人室・集会室のように、それ自体は専有部分になり得る建物部分（または附属の建物）を、規約により共用部分とすることができる。</p>",
 warn:"<b>対抗要件＝登記</b>：「共用部分である旨の登記」をしなければ第三者に対抗できない。法定共用部分（登記不要）との対比で覚える。"},
{t:"規約敷地", chip:"5条",
 body:"<p>建物が現に所在する土地（<b>法定敷地</b>）以外にも、規約により隣接する駐車場等の土地を「建物の敷地」とすることができる（<b>規約敷地</b>）。法定敷地・規約敷地とも敷地利用権の対象になりうる。</p>"},
{t:"共用部分の持分割合", chip:"14条", hot:"数字の精度", key:true,
 body:"<p><b>1項</b>　原則、各共有者の持分はその有する専有部分の<mark>床面積の割合</mark>による。</p><p><b>2項</b>　床面積は壁その他の区画の<mark>「内側線」</mark>で囲まれた部分の水平投影面積＝<b>内法（うちのり）計算</b>。</p><p><b>3項</b>　これらは規約で別段の定めが可能（例：壁芯計算、住戸タイプごとの均等割等）。</p><p><b>4項</b>　一部共用部分でも区分所有者全員の利害に関係するものは、規約により全員の共用部分とみなせる。</p>",
 warn:"<b>内法 ⇄ 壁芯</b>：壁芯は建築基準法の延床面積算定等の考え方。区分所有法の床面積は<b>内法</b>。最も狙われる混同ポイント。"},
{t:"分離処分の禁止", chip:"15条・22条", key:true,
 body:"<p>共用部分の持分は専有部分の処分に従い、<mark>専有部分と分離して処分できない</mark>（15条）。</p><p>敷地利用権が数人で有する権利（共有・準共有）である場合も、専有部分とその専有部分に係る敷地利用権を分離して処分できない（22条1項）。<b>ただし規約に別段の定めがあればこの限りでない。</b></p><p>敷地利用権の割合も、規約に別段の定めがない限り<b>床面積割合に準じる</b>（22条2項、14条準用）。</p>"},
{t:"分離処分禁止違反の効果", chip:"22条3項",

{t:"先取特権", chip:"7条", hot:"実務直結", key:true,
 body:"<p>次の債権を有する者は、<b>債務者の区分所有権（共用部分の共有持分を含む）</b>及び<b>建物内に備え付けた動産</b>の上に先取特権を有する。</p><table class=tbl><tr><th>①</th><td>共用部分・敷地利用権に関し他の区分所有者に対して有する債権</td></tr><tr><th>②</th><td>規約・管理者の職務に関し区分所有者に対して有する債権</td></tr><tr><th>③</th><td>管理組合が区分所有者に対して有する債権（管理費・修繕積立金等の滞納債権）</td></tr></table>",

{t:"特定承継人の責任", chip:"8条", hot:"実務直結", key:true,
 body:"<p>区分所有権を譲り受けた特定承継人（買主等）は、前区分所有者が負っていた滞納管理費等の債務を、<mark>善意・悪意を問わず承継する</mark>。買主が滞納の事実を知らなくても支払義務を免れない。</p>",
 warn:"重要事項説明で滞納の有無を告知する<b>実務上の根拠条文</b>。"},
{t:"瑕疵の推定", chip:"9条",
 body:"<p>建物の設置又は保存に瑕疵があり、それによって他人に損害が生じたときは、その瑕疵は<mark>「共用部分」</mark>の設置又は保存にあるものと推定される。</p>",
 warn:"<b>専有部分ではない</b>。被害者は個々の区分所有者ではなく管理組合（共有者全員）に賠償請求しやすくなる。"},
{t:"宅建との橋渡し", chip:"学習方針",
 body:"<table class=tbl><tr><th style='width:88px'>宅建</th><td>専有部分・共用部分・敷地利用権の基本、規約の設定・変更要件（4分の3）が中心</td></tr><tr><th>管業</th><td>これに加えて、<b>床面積の算定方法の細部・先取特権の順位と効力・規約共用部分の登記の要否</b>まで踏み込む</td></tr></table><p style='margin-top:12px'>「知っているつもり」を<b>数字レベルで解像度を上げ直す</b>意識で臨むこと。</p>"}
],

points:[

{t:"所在等不明区分所有者の除外", chip:"38条の2（新設）", hot:"2026改正", key:true,

{t:"管理者の選任・解任", chip:"25条",
 body:"<p>区分所有者は、<b>規約に別段の定めがない限り集会の決議（普通決議）</b>によって管理者を選任・解任できる。</p><p>管理者の資格に制限はなく、<mark>区分所有者以外の者（管理会社・マンション管理士等の外部専門家）でもよい</mark>。法人でもよい。任期の法定はない。</p><p>管理者に不正な行為その他その職務を行うに適しない事情があるときは、<b>各区分所有者が単独で</b>、その解任を裁判所に請求できる（訴えによる解任請求）。</p>"},
{t:"管理者の権限", chip:"26条", key:true,
 body:"<p>①共用部分等を<b>保存</b>し、②集会の決議を<b>実行</b>し、③規約で定めた行為をする権利を有し義務を負う。</p><p>その職務に関し<b>区分所有者を代理する</b>。損害保険契約に基づく保険金額、共用部分等について生じた損害賠償金・不当利得による返還金の請求及び受領についても代理権を有する。</p><p>規約または集会の決議により、その職務に関し<b>原告又は被告となる</b>ことができる（訴訟追行権）。</p>",
 warn:"<b>代理権に加えた制限は、善意の第三者に対抗することができない</b>（26条4項）。頻出。"},
{t:"管理所有", chip:"27条・20条",
 body:"<p>管理者は、<b>規約に特別の定めがあるとき</b>に限り共用部分を所有することができる（管理所有）。<mark>専有部分を管理所有することはできない</mark>。</p><p>管理所有者は保存行為・管理行為はできるが、<b>共用部分の変更をすることはできない</b>。</p>"},
{t:"管理者の義務・事務報告", chip:"28条・43条",
 body:"<p>管理者の権利義務は、法・規約に定めるもののほか<b>委任に関する規定に従う</b>（＝善良な管理者の注意義務）。</p><p>管理者は、<mark>集会において毎年一定の時期に、その事務に関する報告</mark>をしなければならない（43条）。</p>"},
{t:"規約で定められる事項・衡平原則", chip:"30条",
 body:"<p>建物・敷地・附属施設の管理又は使用に関する<b>区分所有者相互間の事項</b>は、法に定めるもののほか規約で定めることができる。</p><p>規約は、専有部分・共用部分等の<b>形状、面積、位置関係、使用目的、利用状況、区分所有者が支払った対価その他の事情</b>を考慮して、区分所有者間の<mark>利害の衡平が図られるように</mark>定めなければならない（30条3項）。</p><p>規約は<b>書面又は電磁的記録</b>により作成しなければならない。</p>"},
{t:"規約の設定・変更・廃止", chip:"31条", hot:"2026改正", key:true,
 body:"<p>【2026改正】<b>定足数</b>として<mark>区分所有者の過半数かつ議決権の過半数を有する者の出席</mark>が必要となり、そのうえで<mark>出席した区分所有者及びその議決権の各4分の3以上</mark>の多数で決する。</p><p><b>一部の区分所有者の権利に特別の影響を及ぼすべきときは、その承諾を得なければならない</b>。この承諾は決議要件とは別枠の要件で、承諾がなければ決議は効力を生じない。</p><p>一部共用部分に関する事項で区分所有者全員の利害に関係しないものを全員の規約で定めるには、<b>一部区分所有者の4分の1を超える者又はその議決権の4分の1を超える議決権を有する者が反対しないこと</b>が必要。</p>"},
{t:"公正証書による規約の設定", chip:"32条", hot:"出題頻度高", key:true,
 body:"<p>最初に建物の専有部分の全部を所有する者（＝分譲業者）は、<b>公正証書により</b>、次の<mark>4項目に限って</mark>単独で規約を設定できる。</p><table class=tbl><tr><th>①</th><td>規約共用部分に関する定め</td></tr><tr><th>②</th><td>規約敷地に関する定め</td></tr><tr><th>③</th><td>専有部分と敷地利用権の分離処分ができる旨の定め</td></tr><tr><th>④</th><td>各専有部分に係る敷地利用権の割合</td></tr></table>",
 warn:"<b>「管理者の選任」「管理費の額」等は公正証書規約で定められない</b>。4項目以外を挙げる選択肢は誤り。"},
{t:"規約の保管・閲覧", chip:"33条",
 body:"<p><b>管理者が保管</b>する。管理者がないときは、建物を使用している区分所有者又はその代理人で<b>規約又は集会の決議で定めるもの</b>が保管する。</p><p>利害関係人の請求があったときは、<mark>正当な理由がある場合を除いて</mark>閲覧を拒むことができない。</p><p>規約の<b>保管場所</b>は、建物内の見やすい場所に<b>掲示</b>しなければならない。</p>"},
{t:"集会の招集", chip:"34条", key:true,
 body:"<p>管理者は<mark>少なくとも毎年1回</mark>集会を招集しなければならない。</p><p><b>区分所有者の5分の1以上で議決権の5分の1以上</b>を有するものは、管理者に対し会議の目的たる事項を示して集会の招集を請求できる。<mark>この定数は規約で減ずることができる</mark>（増やすことはできない）。</p><p>請求後2週間以内にその請求日から4週間以内の日を会日とする招集通知が発せられない場合、請求した区分所有者は自ら集会を招集できる。管理者がないときは、5分の1以上の要件を満たす区分所有者が直接招集できる。</p>"},
{t:"招集通知", chip:"35条", hot:"数字", key:true,
 body:"<p>会日より少なくとも<mark>1週間前</mark>に、会議の目的たる事項<b>及び議案の要領</b>を示して各区分所有者に発する。<mark>【2026改正】この期間は規約で<b>伸長のみ</b>でき、短縮はできなくなった</mark>（改正前は伸縮とも可）。また<b>議案の要領の記載が必要</b>になった点も改正事項。</p><p><b>建替え決議</b>を会議の目的とする場合は<mark>少なくとも2か月前</mark>（規約で<b>伸長のみ</b>可能。短縮は不可）。さらに会日の<b>1か月前まで</b>に説明会を開催しなければならない（62条）。</p><p>専有部分が数人の共有に属するときは、<b>議決権を行使すべき者</b>に通知すれば足りる。通知場所の届出がないときは、専有部分が所在する場所にあてて発すればよい。規約で定めれば建物内の見やすい場所への<b>掲示</b>による通知も可能。</p>"},
{t:"招集手続の省略・決議事項の制限", chip:"36条・37条",
 body:"<p>区分所有者<b>全員の同意</b>があるときは、招集手続を経ないで集会を開くことができる（36条）。</p><p>集会においては、<mark>あらかじめ通知した事項についてのみ決議できる</mark>（37条）。ただし普通決議事項については規約で別段の定めができる。特別決議事項は通知外の決議はできない。</p>"},
{t:"議決権と議決権行使の方法", chip:"38条・39条",
 body:"<p>各区分所有者の議決権は、規約に別段の定めがない限り<mark>共用部分の持分割合（＝専有部分の床面積割合）</mark>による。</p><p>議決権は<b>書面又は代理人によって行使できる</b>。規約又は集会の決議により<b>電磁的方法</b>によることもできる。</p>"},
{t:"占有者（賃借人）の意見陳述権", chip:"44条",
 body:"<p>区分所有者の承諾を得て専有部分を占有する者は、<b>会議の目的たる事項につき利害関係を有する場合</b>に、集会に出席して<mark>意見を述べることができる</mark>。</p>",
 warn:"<b>意見を述べられるだけで議決権はない</b>。この場合、集会招集者は招集通知後遅滞なく、集会の日時・場所・会議の目的たる事項を<b>建物内の見やすい場所に掲示</b>しなければならない。"},
{t:"書面又は電磁的方法による決議", chip:"45条",
 body:"<p>区分所有者<b>全員の承諾</b>があるときは、集会を開かずに書面又は電磁的方法によって決議をすることができる。</p><p>また、決議すべき事項について区分所有者<b>全員の書面又は電磁的方法による合意</b>があったときは、書面による決議があったものとみなされる。</p>"},
{t:"議事録", chip:"42条",
 body:"<p>議事録は<b>議長</b>が作成する。書面で作成するときは、<mark>議長及び集会に出席した区分所有者の2人</mark>がこれに<b>署名</b>しなければならない（押印は令和3年改正で不要になった）。</p><p>保管・閲覧・保管場所の掲示は規約と同じルール（33条準用）。</p>"},
{t:"規約及び集会決議の効力", chip:"46条",
 body:"<p>規約及び集会の決議は、区分所有者の<b>特定承継人に対しても効力を生ずる</b>。</p><p>占有者は、建物・敷地・附属施設の<b>使用方法</b>につき、区分所有者が規約又は集会の決議に基づいて負う義務と<mark>同一の義務</mark>を負う。</p>",
 warn:"占有者が拘束されるのは<b>「使用方法」に限られる</b>。管理費の支払義務まで負うわけではない点に注意。"}
],
ox:[
{q:"改正区分所有法の下では、集会の普通決議は、区分所有者及び議決権の各過半数（全区分所有者を母数とする）で決するのが原則である。", a:false,
 e:"改正により、普通決議の母数は<b>集会に出席した区分所有者</b>に変わりました。書面・電磁的方法・代理人による行使は「出席」に含まれ、まったく意思表示をしなかった欠席者だけが母数から外れます。<b>ただし建替え決議は改正後も全区分所有者が母数のまま</b>である点に注意。"},
{q:"改正区分所有法の下では、建替え決議についても、集会に出席した区分所有者及びその議決権の各5分の4以上の多数で決することとされた。", a:false,
 e:"<b>建替え決議は改正後も「区分所有者及び議決権の各5分の4以上」で、母数は全区分所有者のまま</b>です（62条1項）。出席者多数決になったのは、区分所有権の処分を伴う決議を除いた決議です。ただし耐震性不足等の一定の事由があるときは<b>4分の3以上に緩和</b>されます（62条2項）。"},
{q:"裁判所による所在等不明区分所有者の除外決定を受けた者は、建替え決議に限らず、普通決議を含むすべての集会決議において議決権を有しない。", a:true,
 e:"38条の2（新設）。立法時の資料でも<b>「区分所有権等の処分を伴うものを含む全ての決議」</b>が対象と明示されています。「建替え決議専用の制度」と考えるのは誤り。"},
{q:"管理者は、区分所有者の中から選任しなければならない。", a:false,

{q:"管理者の代理権に加えた制限は、善意の第三者に対抗することができない。", a:true,
 e:"26条4項。取引の安全を保護する規定で、頻出論点です。"},
{q:"管理者は、規約に特別の定めがあるときは、共用部分のほか専有部分についても管理所有することができる。", a:false,

{q:"改正区分所有法の下では、集会の招集通知を発すべき「会日より少なくとも1週間前」という期間は、規約で伸長することはできるが、短縮することはできない。", a:true,
 e:"改正前は<b>伸縮とも可能</b>でしたが、改正により<b>伸長のみ</b>となりました。あわせて、招集通知には会議の目的たる事項に加えて<b>議案の要領</b>の記載が必要になった点も改正事項です。"},
{q:"管理者に対して集会の招集を請求できる区分所有者の定数（5分の1以上）は、規約で増加することができる。", a:false,

{q:"最初に建物の専有部分の全部を所有する者は、公正証書により、管理者の選任に関する規約を設定することができる。", a:false,

{q:"専有部分を賃借している占有者は、会議の目的たる事項につき利害関係を有する場合には、集会に出席して意見を述べ、かつ議決権を行使することができる。", a:false,
 e:"44条により<b>意見を述べることはできますが、議決権はありません</b>。「意見陳述権はあるが議決権はない」がセットの知識です。"},
{q:"集会の議事録を書面で作成するときは、議長及び集会に出席した区分所有者の2人がこれに署名しなければならない。", a:true,
 e:"42条3項。かつては「署名押印」でしたが、令和3年のデジタル関連法改正により<b>押印は不要</b>となり署名のみになりました。"}

 body:"<p>区分所有者は、建物の保存に有害な行為その他建物の管理又は使用に関し<b>区分所有者の共同の利益に反する行為</b>をしてはならない。占有者も同様の義務を負う。</p><p>この義務違反に対する措置が57条〜60条の4段階。</p>"},
{t:"義務違反者に対する措置（4段階）", chip:"57〜60条", hot:"表で暗記", key:true,
 body:"<table class=tbl><tr><th>措置</th><th>相手方</th><th>決議要件</th><th>訴え</th><th>弁明の機会</th></tr><tr><td>①行為の停止等の請求（57条）</td><td>区分所有者・占有者</td><td>普通決議<br>（訴訟提起の場合）</td><td>訴訟外の請求も可</td><td>不要</td></tr><tr><td>②専有部分の使用禁止請求（58条）</td><td>区分所有者</td><td>4分の3以上</td><td><b>必ず訴え</b></td><td><b>必要</b></td></tr><tr><td>③区分所有権の競売請求（59条）</td><td>区分所有者</td><td>4分の3以上</td><td><b>必ず訴え</b></td><td><b>必要</b></td></tr><tr><td>④占有者に対する引渡し請求（60条）</td><td>占有者</td><td>4分の3以上</td><td><b>必ず訴え</b></td><td><b>必要</b></td></tr></table><p>②〜④は「共同生活上の障害が著しく、<b>他の方法によってはその障害を除去することが困難であるとき</b>」という補充性の要件が必要。</p>",
 warn:"<b>競売請求の細部</b>：判決に基づく競売の申立ては<mark>判決確定日から6か月以内</mark>にしなければならない。また、義務違反者本人及びその者の指定した者は<b>買受けの申出をすることができない</b>。"},
{t:"復旧（小規模滅失・大規模滅失）", chip:"61条", hot:"数字", key:true,
 body:"<table class=tbl><tr><th></th><th>小規模滅失（建物価格の1/2以下）</th><th>大規模滅失（1/2超）</th></tr><tr><th>単独復旧</th><td><b>できる</b>（復旧・建替え決議があるまで）</td><td>できない</td></tr><tr><th>決議要件</th><td>普通決議</td><td><b>4分の3以上</b></td></tr><tr><th>買取請求</th><td>なし</td><td><b>あり</b></td></tr></table><p>大規模滅失の復旧決議があったとき、<b>決議に賛成しなかった区分所有者</b>は、決議賛成者に対し建物及び敷地に関する権利を<mark>時価で買い取るべきこと</mark>を請求できる（決議日から2週間経過後）。</p>",
 warn:"滅失の日から<mark>6か月以内</mark>に復旧決議・建替え決議のいずれもないときは、各区分所有者は他の区分所有者に対して買取請求をすることができる。"},
{t:"建替え決議", chip:"62条", hot:"最頻出", key:true,
 body:"<p><mark>区分所有者（議決権を有しない者を除く）及び議決権の各5分の4以上</mark>の多数による決議。<b>この母数は改正後も「全区分所有者」のままで、出席者ベースにはなっていない</b>（62条1項）。</p><p>【2026改正】ただし、建物が<b>地震又は火災に対する安全性に係る建築基準法等への不適合</b>など一定の事由に該当する場合は、決議要件が<mark>5分の4以上から4分の3以上に緩和</mark>された（62条2項）。</p><p><b>手続</b>：招集通知は会日の<b>2か月前</b>まで（規約で伸長のみ可）／会日の<b>1か月前</b>までに説明会を開催。</p><p><b>決議事項（4つ）</b>：①再建建物の設計の概要、②建物の取壊し及び再建建物の建築に要する費用の概算額、③②の費用の分担に関する事項、④再建建物の区分所有権の帰属に関する事項。</p>",
 warn:"【2026改正・新設】建替え決議があったときは、<b>決議に賛成した区分所有者等は専有部分の賃借人に対し賃貸借の終了を請求でき、請求の日から6か月の経過により賃貸借は終了する</b>（64条の2）。この場合、区分所有者と請求者は賃借人に対し<b>連帯して補償金を支払う</b>。使用貸借・配偶者居住権にも準用される。"},
{t:"売渡請求", chip:"63条", hot:"数字", key:true,
 body:"<p>建替え決議後、集会招集者は<b>遅滞なく</b>、決議に賛成しなかった区分所有者に対し、建替えに<b>参加するか否かを回答すべき旨</b>を書面で催告する。</p><p>催告を受けた者は<mark>2か月以内</mark>に回答しなければならず、回答しないときは<b>参加しない旨を回答したものとみなされる</b>。</p><p>回答期間満了日から<mark>2か月以内</mark>に、建替え合意者（等）は不参加者に対し、区分所有権及び敷地利用権を<b>時価で売り渡すべきこと</b>を請求できる。</p>"},
{t:"【新設】再生手法の多様化", chip:"64条の5〜64条の8", hot:"2026改正", key:true,
 body:"<p>従来は「建替え」がほぼ唯一の再生手段だったが、改正により次の4つが多数決決議で可能になった。</p><table class=tbl><tr><th>建物更新決議（64条の5）</th><td><b>一棟まるごとのリノベーション</b>（取り壊さずに全体を更新）</td></tr><tr><th>建物敷地売却決議（64条の6）</th><td>建物と敷地を<b>一括して第三者に売却</b></td></tr><tr><th>建物取壊し敷地売却決議（64条の7）</th><td>建物を取り壊した上で敷地を売却</td></tr><tr><th>取壊し決議（64条の8）</th><td>取り壊しのみを行う</td></tr></table><p>いずれも建替え決議と同様に<b>原則5分の4以上</b>（<mark>母数は全区分所有者。出席者ベースではない</mark>）。耐震性不足等の場合は<b>4分の3以上</b>に緩和される。</p>",
 warn:"新設分野のため過去問がない。<b>「建替え以外に4つの選択肢が加わった」「原則5分の4」「緩和ルートがある」</b>の3点を確実に。<br>なお建替え決議の<b>賃借人への賃貸借終了請求（64条の2）</b>は、これら4つの決議にも準用される。"},
{t:"【新設】管理不全への対応と管理計画認定制度", chip:"2026改正",
 body:"<p><b>財産管理制度（3種類）</b>：<mark>所有者不明専有部分管理命令（46条の2）</mark>／<mark>管理不全専有部分管理命令（46条の8）</mark>／<mark>管理不全共用部分管理命令（46条の13）</mark>。いずれも<b>利害関係人の請求により裁判所が管理人を選任</b>する。</p><p><b>国内管理人（6条の2）</b>：区分所有者が国内に住所等を有しない場合、専有部分等の管理事務を行わせるため国内に住所等を有する者を管理人として選任できる制度も新設された。</p><p><b>管理計画認定制度の拡充</b>：従来は既存マンションの管理組合が申請する制度だったが、<b>新築時に分譲事業者が管理計画を作成し認定申請できる</b>仕組みが導入された（適正化法側の改正。第12週で再度扱う）。</p><p><b>地方公共団体の取組充実</b>：危険なマンションへの勧告等の権限が創設された（この部分の施行は公布から6か月以内）。</p>"},
{t:"団地", chip:"65〜70条",
 body:"<p><b>団地建物所有者の団体</b>：一団地内に数棟の建物があり、その団地内の土地又は附属施設が団地建物所有者の共有に属する場合、それらの管理を行う団体が当然に構成される。</p><p><b>団地共用部分</b>：規約により団地共用部分を定めることができる（登記が対抗要件）。</p><p><b>建替え承認決議（69条）</b>【2026改正】：<mark>議決権の過半数を有する団地建物所有者が出席し、出席者の議決権の4分の3以上</mark>（耐震性不足等の場合は3分の2以上）。<b>ここは出席者ベースに緩和された</b>。</p><p><b>一括建替え決議（70条）</b>【2026改正】：①団地全体で<mark>区分所有者及び議決権の各5分の4以上</mark>（母数は全員）。かつ②<mark>いずれかの棟で「区分所有者の3分の1超」又は「議決権の3分の1超」が反対しないこと</mark>。</p><p><b>団地内建物敷地売却決議（71条）</b>【新設】：一括建替えと同じ要件で、団地内建物及び敷地を一括売却できる。</p>",
 warn:"<b>各棟要件が改正で反転した</b>。改正前は「各棟で3分の2以上の<b>賛成</b>が必要」だったが、改正後は「各棟で3分の1超の<b>反対がない</b>こと」に変わった。賛成要件から反対要件への転換は最も狙われるポイント。"},
{t:"被災マンション法", chip:"関連法",
 body:"<p>大規模な災害で建物が<b>全部滅失</b>した場合、政令で指定されると、<b>敷地共有者等</b>が集会を開き、多数決で<b>再建決議</b>や<b>敷地売却決議</b>（いずれも議決権の5分の4以上）ができる。</p><p>区分所有法は「建物が存在すること」を前提とする法律であるため、全部滅失時のルールを補完するのが被災マンション法という位置づけ。今回の改正で被災区分所有法も併せて改正されている。</p>"}
],

"標準管理規約は<b>令和7年（2025年）10月17日に改正</b>され、改正区分所有法に対応した。2026年度試験は改正後の内容が前提。",
"標準管理規約はあくまで国交省が示す<b>ひな形であり、それ自体に法的拘束力はない</b>。この位置づけを最初に確認すること。"
],
points:[
{t:"標準管理規約の位置づけ", chip:"総論", key:true,
 body:"<p>国土交通省が作成した管理規約の<mark>モデル（ひな形）</mark>。<b>法令ではないため、それ自体に法的拘束力はない</b>。各マンションが総会決議で採用して初めて、そのマンションの規約になる。</p><p>3類型がある：<b>単棟型／団地型／複合用途型</b>。試験では原則として単棟型が前提。</p>",
 warn:"<b>令和7年10月17日改正</b>。改正区分所有法（2026年4月施行）に合わせ、総会の定足数・決議要件、議案の要領の通知、修繕積立金の使途、再生手法、管理不全対応等が見直された。条番号が改正で動いている可能性があるため、<b>条番号よりも内容で覚える</b>のが安全。"},
{t:"専有部分の範囲", chip:"専有／共用の線引き", hot:"最頻出", key:true,
 body:"<p>専有部分は<b>住戸番号を付した住戸</b>。ただし、その具体的範囲は次のように限定される。</p><table class=tbl><tr><th>天井・床・壁</th><td><b>躯体部分を除く</b>部分が専有部分（内装側だけ）</td></tr><tr><th>玄関扉</th><td><mark>錠及び内部塗装部分</mark>が専有部分（外部塗装面・扉本体は共用部分）</td></tr><tr><th>窓枠・窓ガラス</th><td><mark>専有部分に含まれない＝共用部分</mark></td></tr><tr><th>設備</th><td>専有部分の専用に供されるものは専有部分。本管・本線から枝分かれした部分の扱いに注意</td></tr></table>",
 warn:"<b>覚え方</b>：外から見えるものは基本的にみんなのもの（共用）。玄関扉は「鍵と内側の塗装だけが自分のもの」。"},
{t:"共用部分の範囲", chip:"別表第2",
 body:"<p>エントランスホール、廊下、階段、エレベーターホール、エレベーター室、電気室、機械室、受水槽室、屋上、屋根、内外壁、界壁、床スラブ、支柱、パイプスペース、メーターボックス（<b>ただし住戸メーターを除く</b>）、集会室 等。</p><p><mark>バルコニー・玄関扉・窓枠窓ガラス・1階に面する庭・屋上テラス</mark>も共用部分であり、特定の区分所有者に<b>専用使用権</b>が認められる部分（専用使用部分）。</p>"},
{t:"敷地及び共用部分等の共有・持分", chip:"共有",
 body:"<p>敷地及び共用部分等は<b>区分所有者の共有</b>とし、各区分所有者の共有持分は<b>別表第3</b>による（専有部分の床面積割合が基本）。</p><p>区分所有者は、その有する専有部分と<mark>敷地及び共用部分等の共有持分とを分離して処分することができない</mark>。</p>"},
{t:"用法（住宅としての使用）", chip:"用法",
 body:"<p>区分所有者は、その専有部分を<mark>専ら住宅として使用</mark>するものとし、他の用途に供してはならない。</p><p>暴力団事務所としての使用等の禁止、<b>住宅宿泊事業（民泊）</b>を可能とするか禁止するかを規約に明記する規定例が示されている。</p>"},
{t:"バルコニー等の専用使用権", chip:"専用使用", hot:"頻出", key:true,
 body:"<p>区分所有者は、バルコニー・玄関扉・窓枠及び窓ガラス・1階に面する庭・屋上テラスについて、<b>専用使用権</b>を有する（共用部分だが特定の者が排他的に使用できる）。</p><p><mark>1階に面する庭を専用使用する者は、使用料を管理組合に納入しなければならない</mark>。</p><p>専用使用部分であっても、<b>通常の使用に伴う</b>保存行為（日常清掃・電球交換等）は専用使用権者の責任と負担で行う。それ以外（計画修繕等）は管理組合が行う。</p>",
 warn:"バルコニーは<b>避難通路</b>でもあるため、避難の妨げとなる物品の設置は禁止。「専用使用権があるから何を置いてもよい」は誤り。"},
{t:"駐車場の使用", chip:"駐車場", key:true,
 body:"<p>管理組合は、特定の区分所有者と<b>駐車場使用契約</b>を締結して使用させることができ、使用者は<b>駐車場使用料</b>を納入する。</p><p><mark>区分所有者がその専有部分を第三者に譲渡又は貸与したときは、駐車場使用契約はその効力を失う</mark>。</p><p>駐車場使用料その他の使用料は、それらの<b>管理に要する費用に充てるほか、修繕積立金として積み立てる</b>。</p>",
 warn:"駐車場使用権は専有部分に付随して当然に移転するものではない。「売主が使っていた駐車場を買主がそのまま使える」は誤り。実務でのトラブル源でもある。"},
{t:"専有部分の修繕等（理事長承認）", chip:"リフォーム", hot:"実務直結", key:true,
 body:"<p>区分所有者は、共用部分又は他の専有部分に<b>影響を与えるおそれのある</b>専有部分の修繕・模様替え・建物に定着する物件の取付け又は取替え（＝リフォーム）を行おうとするときは、<mark>あらかじめ理事長にその旨を申請し、書面（又は電磁的方法）による承認を受けなければならない</mark>。</p><p>理事長は<b>理事会の決議</b>により承認・不承認を決定する。</p><p>承認を受けた工事の後、その工事により共用部分又は他の専有部分に影響が生じた場合は、<b>その工事を発注した区分所有者の責任と負担</b>で必要な措置をとらなければならない。</p>",
 warn:"承認は<b>理事長個人の判断ではなく理事会決議</b>で決まる。「理事長が単独で承認できる」は誤り。"},
{t:"窓ガラス等の改良", chip:"改良工事",
 body:"<p>共用部分のうち各住戸に附属する窓枠・窓ガラス・玄関扉その他の開口部に係る<b>改良工事</b>であって、<mark>防犯・防音・断熱等の住宅の性能の向上等に資するもの</mark>については、<b>管理組合がその責任と負担において計画修繕として実施する</b>。</p><p>管理組合が速やかに実施できない場合には、区分所有者は<b>理事長の書面による承認</b>を受けて、自己の責任と負担で当該工事を実施することができる。</p>"},
{t:"必要箇所への立入り", chip:"立入り",
 body:"<p>管理を行う者は、管理を行うために必要な範囲内において、<b>他の者が管理する専有部分又は専用使用部分への立入りを請求</b>することができる。請求を受けた者は、正当な理由がなければこれを拒否してはならない。</p><p><mark>災害・事故等が発生し、緊急に立ち入らないと共用部分等又は他の専有部分に対して物理的・機能上重大な影響を与えるおそれがあるときは、承諾を得ずに立ち入ることができる</mark>。</p>"},
{t:"専有部分の貸与", chip:"賃貸",
 body:"<p>区分所有者は、その専有部分を第三者に貸与する場合には、<b>規約及び使用細則に定める事項を賃借人に遵守させる旨の契約上の義務を負わせる</b>とともに、その<mark>誓約書を管理組合に提出させなければならない</mark>。</p><p>また、暴力団員への貸与を禁止する規定が置かれている（暴力団排除条項）。</p>"},
{t:"損害保険", chip:"保険",
 body:"<p>区分所有者は、共用部分等に関し<b>損害保険契約を締結すること</b>を承認する。</p><p>理事長は、この契約に基づく<b>保険金額の請求及び受領</b>について、区分所有者を<mark>代理する</mark>（区分所有法26条2項の管理者の代理権に対応）。</p>"}
],

{t:"使用料の取扱い", chip:"使用料",
 body:"<p>駐車場使用料その他の敷地及び共用部分等に係る使用料は、<b>それらの管理に要する費用に充てるほか、修繕積立金として積み立てる</b>。</p>",
 warn:"「使用料は全額を管理費に充当する」は誤り。<mark>管理費用に充当した残りは修繕積立金へ</mark>が正解。"},
{t:"組合員の資格", chip:"組合員",
 body:"<p>組合員の資格は、<b>区分所有者となったときに取得し、区分所有者でなくなったときに喪失する</b>。</p><p>新たに組合員の資格を取得し又は喪失した者は、<mark>直ちにその旨を書面又は電磁的方法により管理組合に届け出なければならない</mark>。</p>"},
{t:"管理組合の業務", chip:"業務",
 body:"<p>管理組合の主な業務：管理組合が管理する敷地及び共用部分等の保安・保全・保守・清掃・消毒・ごみ処理、組合管理部分の修繕、<b>長期修繕計画の作成又は変更に関する業務</b>、修繕等の履歴情報の整理及び管理等、宅地建物取引業者等への<b>管理状況の書面交付</b>、共用部分等に係る火災保険等、修繕積立金の運用、官公署等との渉外業務、風紀・秩序・安全の維持、防災に関する業務 等。</p><p><b>長期修繕計画</b>は<mark>計画期間30年以上</mark>かつ<mark>大規模修繕工事が2回以上含まれる期間以上</mark>とすることが標準とされている（5年程度ごとに見直し）。</p>"},
{t:"役員", chip:"理事・監事", key:true,
 body:"<p>役員は<b>理事長・副理事長・会計担当理事・理事・監事</b>。<mark>理事長は区分所有法に定める管理者</mark>とする。</p><p>役員は<b>総会で選任・解任</b>する。理事長・副理事長・会計担当理事は、<mark>理事会で理事の中から選任・解任</mark>する。</p><p><b>利益相反取引の防止</b>：役員は、自己又は第三者のために管理組合と取引をしようとするとき等は、理事会において重要な事実を開示し、その承認を受けなければならない。</p>",
 warn:"「理事長は総会で直接選ぶ」は誤り。<b>総会で理事を選び、その理事の中から理事会が理事長を選ぶ</b>という二段構え。"},
{t:"監事の権限", chip:"監事",
 body:"<p>監事は管理組合の業務の執行及び財産の状況を監査し、その結果を総会に報告する。</p><p>監事は<b>理事会に出席し、必要があると認めるときは意見を述べなければならない</b>（出席は義務）。</p><p>監事は、必要があると認めるときは<b>理事会の招集を請求</b>でき、請求後一定期間内に招集されないときは<mark>自ら理事会を招集できる</mark>。</p>"},
{t:"総会", chip:"総会", hot:"令和7年改正", key:true,
 body:"<p><b>通常総会</b>は、<mark>毎年1回、新会計年度開始以後2か月以内</mark>に招集しなければならない。臨時総会は必要に応じて招集する。</p><p><b>招集通知</b>は、少なくとも会議を開く日の<mark>2週間前</mark>までに発する（<b>建替え決議等を目的とする場合は2か月前</b>）。区分所有法の1週間よりも規約で長く設定している点に注意。</p><p><b>組合員が総会の招集を請求</b>するには、組合員総数の5分の1以上及び議決権総数の5分の1以上の同意が必要。</p>",
 warn:"<b>令和7年10月改正</b>で、総会の定足数と決議要件が改正区分所有法に合わせて見直された。国土交通省の周知資料によれば、<b>令和8年4月1日以降に総会の招集手続を開始する場合</b>、規約改正の総会は<mark>定足数＝区分所有者総数及び議決権総数の各過半数の出席</mark>、<mark>決議要件＝総会に出席した区分所有者及びその議決権の各4分の3以上</mark>となる（従前は「議決権総数の半数以上の出席」「組合員総数及び議決権総数の各4分の3以上」）。<br>ただし<b>建替え決議は従来どおり組合員総数及び議決権総数の各5分の4以上</b>で、出席者ベースにはならない。"},
{t:"議決権と代理人", chip:"議決権",
 body:"<p>各組合員の議決権は<b>共用部分の共有持分の割合</b>（住戸1戸につき各1個とする例も示されている）。</p><p>組合員は、書面又は代理人によって議決権を行使できる。<b>代理人になれる者</b>は次のいずれか。</p><table class=tbl><tr><th>①</th><td>その組合員の配偶者又は一親等の親族</td></tr><tr><th>②</th><td>その組合員の住戸に同居する親族</td></tr><tr><th>③</th><td>他の組合員</td></tr></table>",
 warn:"<b>誰でも代理人になれるわけではない</b>。管理会社の社員や外部の第三者を代理人とすることは、この規定の下では認められない。"},
{t:"総会の決議事項", chip:"総会の権限",
 body:"<p>総会の決議を要する主な事項：規約及び使用細則等の制定・変更・廃止、役員の選任・解任、<b>収支決算及び事業報告／収支予算及び事業計画</b>、長期修繕計画の作成又は変更、<b>管理費等及び使用料の額並びに賦課徴収方法</b>、<b>修繕積立金の保管及び運用方法</b>、特別の管理の実施及びそれに充てるための<b>資金の借入れ</b>、区分所有法上の訴訟提起、建替え等、<b>組合管理部分に関する管理委託契約の締結</b> 等。</p>",
 warn:"<b>管理委託契約の締結は総会決議事項</b>。理事会だけで管理会社を決めることはできない。ここは頻出。"},
{t:"理事会", chip:"理事会", key:true,
 body:"<p>理事会は理事をもって構成する。<mark>理事の半数以上が出席しなければ会議を開き議事を決することができない</mark>。議事は<b>出席理事の過半数</b>で決する。</p><p><b>理事会の決議事項</b>：収支決算案・事業報告案・収支予算案・事業計画案、規約・使用細則等の制定等に関する<b>案</b>、長期修繕計画の作成・変更に関する<b>案</b>、その他総会に提出する議案、専有部分の修繕等の承認・不承認、収支予算外の緊急支出、理事長・副理事長・会計担当理事の選任・解任 等。</p>",
 warn:"総会に出すのは「<b>案</b>」まで。決めるのは総会。この<b>案（理事会）→決定（総会）</b>の流れが問題文の切り分けポイント。"},
{t:"会計・予算", chip:"会計",
 body:"<p>会計年度は毎年<b>4月1日から翌年3月31日まで</b>（標準例）。</p><p>理事長は毎会計年度の<b>収支予算案</b>を通常総会に提出し、その承認を得なければならない。</p><p><mark>会計年度開始後、収支予算案の承認を得るまでの間に、通常の管理に要する経常的な経費のうち必要なものは、理事会の承認を得て支出することができる</mark>（後に収支予算案の承認を得たときは、その支出は当該予算による支出とみなす）。</p>"},
{t:"管理費等の徴収と滞納対応", chip:"滞納", hot:"実務直結", key:true,
 body:"<p>管理組合は、管理費等について<b>組合員が指定する預金口座からの振替の方法により徴収</b>するのが原則。</p><p>組合員が納付を怠ったときは、管理組合は<b>遅延損害金</b>と<mark>違約金としての弁護士費用並びに督促及び徴収の諸費用</mark>を加算して請求できる。</p><p>理事長は、<b>理事会の決議により</b>、未納の管理費等の請求に関して、<mark>区分所有法57条に基づき、管理組合を代表して訴訟その他法的措置を追行することができる</mark>。</p>",
 warn:"滞納請求の訴訟提起は<b>理事会の決議で足りる</b>（総会決議は不要）。他の訴訟（義務違反者への措置等）が総会決議を要するのとの対比で狙われる。"},
{t:"帳票類等の作成・保管と閲覧", chip:"開示",
 body:"<p>理事長は、<b>会計帳簿・什器備品台帳・組合員名簿</b>及びその他の帳票類を作成して保管し、組合員又は利害関係人の<b>理由を付した書面による請求</b>があったときは、これらを閲覧させなければならない。</p><p>理事長は、宅地建物取引業者等から<b>管理状況の書面交付</b>を求められたときは、これに応じなければならない（重要事項説明の前提となる資料）。</p>"}
],

 body:"<table class=tbl><tr><th>①事務管理業務</th><td><b>基幹事務</b>（後述）＋基幹事務以外の事務管理業務（理事会・総会の支援業務、各種点検の報告・助言等）</td></tr><tr><th>②管理員業務</th><td>受付等の業務、点検業務、立会業務、報告連絡業務</td></tr><tr><th>③清掃業務</th><td>日常清掃・定期清掃</td></tr><tr><th>④建物・設備管理業務</th><td>建物点検・給排水設備・電気設備・消防用設備等の点検保守</td></tr></table>"},
{t:"基幹事務とは（3つ）", chip:"適正化法2条", hot:"暗記必須", key:true,
 body:"<table class=tbl><tr><th>①</th><td>管理組合の会計の<b>収入及び支出の調定</b></td></tr><tr><th>②</th><td><b>出納</b></td></tr><tr><th>③</th><td>マンションの<b>維持又は修繕に関する企画又は実施の調整</b></td></tr></table><p>この3つを<b>すべて含んで</b>行うのが「マンション管理業」。1つでも欠ければ管理業の登録は不要。</p>",
 warn:"<b>基幹事務は一括して第三者に再委託してはならない</b>（適正化法74条）。一部の再委託は可能。「基幹事務は一切再委託できない」は言い過ぎで誤り。"},
{t:"再委託と責任", chip:"4条",
 body:"<p>管理業者は、事務管理業務のうち基幹事務以外の業務、管理員業務・清掃業務・建物設備管理業務の<b>全部又は一部を第三者に再委託することができる</b>。</p><p>再委託した場合、管理業者は<mark>再委託先の履行について管理組合に対して責任を負う</mark>。</p>"},
{t:"善管注意義務", chip:"5条",
 body:"<p>管理業者は、<b>善良な管理者の注意をもって</b>管理事務を行うものとする（委任契約の性質）。</p>"},
{t:"管理事務室等の使用", chip:"7条",
 body:"<p>管理組合は、管理業者に対し、管理事務を行うために必要な<b>管理事務室・管理用倉庫・清掃用具入れ等を無償で使用させる</b>ものとする。</p><p>ただし<mark>水道光熱費・通信費・備品費等をどちらが負担するかは契約書で明記する</mark>（自動的に管理組合負担とは限らない）。</p>"},
{t:"緊急時の業務", chip:"8条", hot:"頻出", key:true,
 body:"<p>管理業者は、<b>災害又は事故等の事由により、管理組合のために緊急に行う必要がある業務</b>で、管理組合の承認を受ける時間的な余裕がないものについては、<mark>承認を受けないで実施することができる</mark>。</p><p>この場合、管理業者は<b>速やかに書面をもって</b>その業務の内容・費用等を管理組合に通知しなければならない。</p><p>要した費用は<b>管理組合が負担する</b>（管理業者の責めによる事故等の場合を除く）。</p>"},
{t:"管理事務の報告", chip:"9条", hot:"数字", key:true,
 body:"<table class=tbl><tr><th>年次報告</th><td>管理組合の<b>事業年度終了後</b>、管理事務に関する報告書を作成して交付し、<mark>管理業務主任者をして報告をさせる</mark></td></tr><tr><th>月次報告</th><td><mark>毎月末日まで</mark>に、前月における会計の収支状況に関する書面を交付</td></tr><tr><th>随時</th><td>管理組合から請求があるときは、管理事務の処理状況及び会計の収支状況について報告</td></tr></table>",
 warn:"年次報告は<b>管理業務主任者でなければ行えない</b>。月次の書面交付には主任者要件がない点との対比が問われる。"},
{t:"管理費等滞納者に対する督促", chip:"10条", hot:"実務直結", key:true,
 body:"<p>出納業務を行う場合、管理業者は、支払期限後の一定期間、<b>電話・自宅訪問・督促状の送付</b>により滞納者に督促を行う。</p><p>それでも滞納者が支払わないときは、管理業者は<mark>その責めを免れる</mark>ものとし、その後の請求は管理組合が行う。</p>",
 warn:"管理業者が行えるのは<b>事実行為としての督促まで</b>。<mark>支払督促の申立てや訴訟提起といった法的手段は行えない</mark>（弁護士法72条の非弁行為に当たるため）。ここが最頻出のひっかけ。"},
{t:"有害行為の中止要求", chip:"12条",
 body:"<p>管理業者は、区分所有者等が法令・管理規約・使用細則に違反する行為等を行ったときは、<b>その中止を求めることができる</b>。</p><p>中止を求めても行為をやめないときは、<mark>書面をもって管理組合に報告</mark>し、それ以降はその責めを免れる。以後の対応は管理組合が行う。</p>"},
{t:"管理規約等の提供・開示", chip:"15条",
 body:"<p>管理業者は、<b>宅地建物取引業者</b>又は<b>組合員</b>から、当該マンションの管理規約や別表に定める事項（管理費等の額、滞納状況、修繕積立金の残高、長期修繕計画、大規模修繕の実施予定等）の提供・開示を求められたときは、管理組合に代わってこれを行う。</p><p>この場合、管理業者は<mark>相手方に対し、費用を請求することができる</mark>。</p>",
 warn:"これは<b>中古マンション売買の重要事項説明の前提資料</b>そのもの。実務では管理会社に開示請求をかける場面。"},
{t:"免責事項", chip:"19条",
 body:"<p>管理業者は、管理組合又は組合員等が<b>第三者に対して損害賠償義務を負う場合</b>において、<mark>管理業者の責めに帰することができない事由</mark>によるものについては、その責任を負わない（天災地変、第三者による犯罪行為等）。</p>"},
{t:"契約の解除", chip:"20条", key:true,
 body:"<p><b>催告解除</b>：相手方が契約に定められた義務の履行を怠った場合、<mark>相当の期間を定めて催告</mark>し、期間内に履行がないときは契約を解除できる。</p><p><b>無催告解除</b>：管理業者が銀行の取引を停止されたとき、<b>マンション管理業の登録の取消しを受けたとき</b>、破産手続開始の決定を受けたとき等は、<mark>催告なしに直ちに解除できる</mark>。</p>"},
{t:"解約の申入れ・契約の更新", chip:"21条・23条", hot:"数字", key:true,
 body:"<p><b>解約の申入れ</b>：管理組合・管理業者のいずれからも、相手方に対し<mark>少なくとも3か月前に書面で</mark>解約の申入れを行うことにより契約を終了させることができる（理由は不要）。</p><p><b>更新の申出</b>：契約を更新しようとする場合は、有効期間が満了する日の<mark>3か月前まで</mark>に、相手方に書面で申し出る。</p><p><b>暫定契約</b>：有効期間満了までに更新の合意が成立しないときは、<mark>従前の契約と同一の条件で、期間を定めて暫定契約を締結することができる</mark>。</p>",
 warn:"「3か月前」が2か所出てくる。解約申入れ＝3か月前／更新の申出＝3か月前、と両方セットで覚える。"},
{t:"その他の規定", chip:"諸則",
 body:"<p><b>通知義務</b>：管理組合・管理業者は、名称・住所・役員・登録の変更等があったときは相手方に通知する。</p><p><b>専有部分への立入り</b>：管理業者は必要な範囲で立入りを請求でき、緊急時には承諾なしに立ち入ることができる。</p><p><b>反社会的勢力の排除</b>：暴力団員等でないことの確約、違反時の無催告解除。</p><p><b>個人情報の取扱い</b>：目的外利用の禁止、漏えい防止措置。</p>"}
],

{t:"代理の基本", chip:"99条〜",
 body:"<p>代理行為の効果が本人に帰属するには、①<b>代理権の存在</b>、②<b>顕名</b>（本人のためにすることを示す）、③代理行為が必要。</p><p>顕名がない場合は<b>代理人自身のためにしたものとみなされる</b>（相手方が悪意又は有過失なら本人に効果帰属）。</p><p><b>自己契約・双方代理は原則無効</b>（無権代理とみなされる）。ただし<mark>債務の履行</mark>と<mark>本人があらかじめ許諾した行為</mark>は可能。</p>"},
{t:"無権代理と表見代理", chip:"113〜118条", key:true,
 body:"<p><b>無権代理</b>：本人が追認すれば契約時に遡って有効。相手方には<b>催告権</b>（善意悪意問わず）と<b>取消権</b>（善意の相手方のみ、追認前に限る）がある。</p><p><b>無権代理人の責任</b>：相手方の選択により<b>履行又は損害賠償</b>の責任を負う（相手方が善意無過失であること等が要件）。</p><p><b>表見代理の3類型</b>：①代理権授与の表示、②<b>権限外の行為</b>、③代理権消滅後。いずれも相手方の<mark>善意無過失</mark>が必要。</p>"},
{t:"時効の基本構造", chip:"時効",
 body:"<p><b>取得時効</b>：所有の意思をもって平穏かつ公然と占有 → <mark>20年</mark>（占有開始時に善意無過失なら<mark>10年</mark>）。</p><p><b>消滅時効（債権）</b>：<mark>権利を行使することができることを知った時から5年</mark>、又は<mark>権利を行使することができる時から10年</mark>のいずれか早い方。</p><p><b>人の生命又は身体の侵害</b>による損害賠償請求権は、客観的起算点から<b>20年</b>に伸長される。</p>",
 warn:"<b>管理費債権は原則5年で時効消滅</b>する（毎月の支払期日ごとに進行）。滞納放置が致命傷になる根拠。"},
{t:"時効の完成猶予と更新", chip:"147条〜", hot:"実務直結", key:true,
 body:"<table class=tbl><tr><th>裁判上の請求</th><td>手続中は<b>完成猶予</b>、確定判決等で権利確定すれば<b>更新</b>（時効期間は10年に）</td></tr><tr><th>催告</th><td><mark>6か月間</mark>の完成猶予のみ。催告を繰り返しても再度の猶予は生じない</td></tr><tr><th>承認</th><td>債務者が債務を認めれば<b>更新</b>（一部弁済も承認にあたる）</td></tr><tr><th>協議を行う旨の合意</th><td>書面による合意で最長1年（更新の合意で通算5年まで）の完成猶予</td></tr></table>",
 warn:"滞納者から<b>1円でも入金があれば「承認」となり時効が更新される</b>。逆に督促状（催告）は6か月しか稼げない。"},
{t:"共有の基本", chip:"249〜264条", hot:"区分所有法と直結", key:true,
 body:"<table class=tbl><tr><th>保存行為</th><td>修繕・妨害排除等 → <b>各共有者が単独でできる</b></td></tr><tr><th>管理行為</th><td>賃貸・利用方法の決定等 → <mark>持分の価格の過半数</mark></td></tr><tr><th>軽微変更</th><td>形状又は効用の著しい変更を伴わないもの → <mark>持分の価格の過半数</mark></td></tr><tr><th>変更（重大）</th><td>形状又は効用の著しい変更 → <mark>共有者全員の同意</mark></td></tr></table><p>各共有者は、<b>いつでも共有物の分割を請求できる</b>（5年以内の不分割特約は可）。</p>",
 warn:"区分所有法では、共用部分の<b>重大変更は4分の3以上、軽微変更は普通決議</b>という特則が置かれている。民法の原則（全員同意・過半数）との違いを対比で覚える。"},
{t:"物権変動と対抗要件", chip:"177条",
 body:"<p>不動産に関する物権の得喪変更は、<b>登記</b>をしなければ第三者に対抗できない。</p><p>ただし、<mark>背信的悪意者</mark>や無権利者、不法占拠者に対しては、登記がなくても対抗できる。</p>"},
{t:"債務不履行と解除", chip:"415条・541条〜",
 body:"<p><b>債務不履行の類型</b>：履行遅滞・履行不能・不完全履行。損害賠償請求には<b>債務者の帰責事由</b>が必要（不可抗力なら免責）。</p><p><b>催告解除</b>：相当の期間を定めて催告し、期間内に履行がないとき。ただし<mark>不履行が軽微であるときは解除できない</mark>。</p><p><b>無催告解除</b>：全部履行不能、履行拒絶の明示、定期行為の時期経過等。</p><p><b>解除に債務者の帰責事由は不要</b>（損害賠償と異なる点）。逆に<b>債権者に帰責事由があるときは解除できない</b>。</p>"},
{t:"同時履行の抗弁・危険負担", chip:"533条・536条",
 body:"<p>双務契約の当事者は、相手方が債務の履行を提供するまで自己の債務の履行を拒める（<b>同時履行の抗弁権</b>）。</p><p>当事者双方の責めに帰することができない事由で債務を履行できなくなったときは、債権者は<b>反対給付の履行を拒むことができる</b>。</p>"},
{t:"連帯債務・保証", chip:"436条・446条〜",
 body:"<p><b>保証契約は書面（電磁的記録）でしなければ効力を生じない</b>。</p><p><b>連帯保証</b>には催告の抗弁・検索の抗弁・分別の利益がない。</p><p><b>個人根保証契約</b>は<mark>極度額を定めなければ効力を生じない</mark>（賃貸借の連帯保証で重要）。</p>"},
{t:"弁済・相殺", chip:"473条・505条",
 body:"<p><b>第三者弁済</b>：正当な利益を有しない第三者は、債務者の意思に反して弁済できない（債権者が知らなければ有効）。</p><p><b>相殺</b>：双方の債務が同種の目的を有し、<b>双方が弁済期にある</b>ことが必要（ただし自働債権が弁済期にあれば、受働債権の期限の利益を放棄して相殺可）。</p><p><mark>悪意による不法行為に基づく損害賠償債務、人の生命身体の侵害による損害賠償債務を受働債権とする相殺は禁止</mark>。</p>"}
],

{t:"請負の基本", chip:"632条〜", hot:"大規模修繕に直結", key:true,
 body:"<p>請負は<b>仕事の完成</b>を目的とする契約。報酬は<mark>仕事の目的物の引渡しと同時に</mark>支払う（引渡しを要しない場合は仕事完成後）。</p><p><b>注文者が受ける利益の割合に応じた報酬</b>：注文者の責めに帰することができない事由で仕事が完成不能になった場合や、仕事完成前に契約が解除された場合でも、<b>可分な部分の給付で注文者が利益を受けるときは、その割合に応じて報酬を請求できる</b>。</p>"},
{t:"請負の契約不適合責任", chip:"636条・637条",
 body:"<p>売買の規定が準用され、注文者は<b>追完（修補）請求・報酬減額請求・損害賠償・解除</b>ができる。</p><p><mark>注文者が不適合を知った時から1年以内に通知</mark>しなければ権利を失う。</p><p><b>注文者の供した材料の性質又は注文者の指図によって生じた不適合</b>については、請負人は責任を負わない（請負人がその不適当を知りながら告げなかったときを除く）。</p>"},
{t:"注文者の任意解除権", chip:"641条",

{t:"委任の基本", chip:"643条〜", hot:"管理者の性質", key:true,
 body:"<p>委任は法律行為をすることを相手方に委託する契約（準委任＝事実行為の委託）。</p><p>受任者は<mark>報酬の有無にかかわらず善良な管理者の注意</mark>をもって委任事務を処理する義務を負う。</p><p><b>報酬</b>：特約がなければ無報酬。報酬がある場合は<b>後払い</b>が原則。</p><p><b>費用</b>：受任者は<mark>費用の前払いを請求できる</mark>。立て替えた場合は支出日以後の利息とともに償還請求できる。</p>",
 warn:"区分所有法28条により<b>管理者の権利義務には委任の規定が準用される</b>。理事長＝管理者＝受任者として善管注意義務を負う、という連鎖を押さえる。"},
{t:"委任の報告義務と解除", chip:"645条・651条",

points:[
{t:"賃貸借の基本", chip:"601条〜",
 body:"<p><b>賃貸人の義務</b>：目的物を使用収益させる義務、<mark>修繕義務</mark>。</p><p><b>賃借人の修繕権</b>：賃借人が賃貸人に修繕が必要である旨を通知したのに賃貸人が相当期間内に修繕しないとき、又は急迫の事情があるときは、<b>賃借人が自ら修繕できる</b>。</p><p><b>賃料の減額</b>：賃借物の一部が滅失その他の事由により使用収益できなくなった場合、賃借人の責めに帰すべき事由によるものでなければ、<mark>その割合に応じて当然に賃料が減額される</mark>（請求を要しない）。</p>"},

{t:"敷金", chip:"622条の2",

{t:"賃借権の譲渡・転貸", chip:"612条",
 body:"<p>賃借人は、<b>賃貸人の承諾</b>を得なければ賃借権を譲渡し、又は賃借物を転貸することができない。</p><p>無断譲渡・転貸をして第三者に使用収益させたときは、賃貸人は契約を解除できる。ただし判例上、<mark>背信的行為と認めるに足りない特段の事情</mark>があるときは解除できない。</p>"},
{t:"借地借家法（建物賃貸借）", chip:"借家", hot:"実務直結", key:true,
 body:"<p><b>期間の定めがある場合</b>：期間満了の<mark>1年前から6か月前まで</mark>の間に更新拒絶の通知をしなければ、従前と同一の条件で更新されたものとみなされる（法定更新）。更新拒絶には<b>正当事由</b>が必要。</p><p><b>期間の定めがない場合</b>：賃貸人からの解約申入れは<mark>6か月経過</mark>で終了（正当事由必要）。賃借人からは<b>3か月経過</b>で終了。</p><p><b>対抗要件</b>：建物の<mark>引渡し</mark>を受けていれば、その後に建物を取得した第三者に対抗できる（登記不要）。</p>"},
{t:"定期建物賃貸借", chip:"借地借家法38条",

{t:"不法行為の基本", chip:"709条",
 body:"<p>故意又は過失によって他人の権利又は法律上保護される利益を侵害した者は、これによって生じた損害を賠償する責任を負う。</p><p><b>消滅時効</b>：損害及び加害者を知った時から<mark>3年</mark>（人の生命身体を害する場合は<mark>5年</mark>）、不法行為の時から<mark>20年</mark>。</p>"},
{t:"工作物責任", chip:"717条", hot:"最重要", key:true,
 body:"<p>土地の工作物の<b>設置又は保存に瑕疵</b>があることによって他人に損害を生じたときは、まず<mark>占有者</mark>が賠償責任を負う。ただし占有者が損害の発生を防止するのに<b>必要な注意をしたとき</b>は、<mark>所有者</mark>が賠償しなければならない。</p><p>この<b>所有者の責任は無過失責任</b>（免責されない）。</p>",

{t:"使用者責任・共同不法行為", chip:"715条・719条",
 body:"<p><b>使用者責任</b>：ある事業のために他人を使用する者は、被用者が事業の執行について第三者に加えた損害を賠償する責任を負う（選任監督に相当の注意をしたときは免責）。使用者は被用者に対して<b>信義則上相当と認められる限度で求償</b>できる。</p><p><b>共同不法行為</b>：数人が共同の不法行為で損害を加えたときは<b>連帯して</b>責任を負う。</p>"},
{t:"相続の基本", chip:"887条〜", key:true,
 body:"<table class=tbl><tr><th>配偶者と子</th><td>配偶者<b>1/2</b>・子<b>1/2</b></td></tr><tr><th>配偶者と直系尊属</th><td>配偶者<b>2/3</b>・直系尊属<b>1/3</b></td></tr><tr><th>配偶者と兄弟姉妹</th><td>配偶者<b>3/4</b>・兄弟姉妹<b>1/4</b></td></tr></table><p><b>相続放棄</b>：自己のために相続の開始があったことを知った時から<mark>3か月以内</mark>に家庭裁判所に申述。放棄した者は<b>初めから相続人とならなかったもの</b>とみなされる。</p>"},
{t:"相続と管理費債務", chip:"実務",

{t:"抵当権と先取特権の順位", chip:"担保物権",
 body:"<p><b>抵当権</b>：目的物の占有を移さずに設定する担保物権。順位は登記の前後による。<b>物上代位</b>（賃料・保険金等）が可能だが、払渡し前に差押えが必要。</p><p><b>一般の先取特権</b>：共益の費用・雇用関係・葬式の費用・日用品の供給。</p><p>区分所有法7条の先取特権は<mark>共益費用の先取特権とみなされる</mark>ため、一般の先取特権の中で最優先。ただし<b>登記された抵当権には劣後する</b>のが原則。</p>",

"最大の山は<b>財産の分別管理（76条）</b>。イ・ロ・ハの3方式と印鑑保管の禁止、保証契約の要否は毎年のように問われる。",
"<b>重要事項説明</b>は「新規／同一条件の更新／条件変更の更新」で手続が変わる。この場合分けが全て。",

{t:"契約成立時の書面の交付", chip:"73条", key:true,
 body:"<p>管理受託契約を締結したときは、<mark>遅滞なく</mark>、<b>管理組合の管理者等</b>に対し、契約の内容等を記載した書面を交付しなければならない。</p><p><b>管理者等が置かれていないとき</b>は、<mark>区分所有者等全員</mark>に対して交付する。</p><p>この書面にも<b>管理業務主任者の記名</b>が必要。</p>",

{t:"再委託の制限", chip:"74条",

{t:"帳簿の作成等", chip:"75条", hot:"数字",
 body:"<p>管理業者は、管理受託契約について<b>契約ごとに帳簿を作成</b>し、各事業年度の末日をもって閉鎖し、閉鎖後<mark>5年間</mark>保存しなければならない。</p>"},
{t:"財産の分別管理（3方式）", chip:"76条", hot:"最重要", key:true,
 body:"<p>管理業者は、管理組合から委託を受けて管理する<b>修繕積立金等金銭</b>を、自己の固有財産及び他の管理組合の財産と<mark>分別して管理</mark>しなければならない。</p><table class=tbl><tr><th>イ方式</th><td>管理費等を<b>収納口座</b>に預入 → <mark>翌月末日まで</mark>に、当月分の管理事務費用を控除した残額を<b>保管口座</b>に移し替え</td></tr><tr><th>ロ方式</th><td>管理費等を管理組合名義の<b>収納口座</b>に預入 → <mark>翌月末日まで</mark>に残額を<b>保管口座</b>に移し替え</td></tr><tr><th>ハ方式</th><td>管理費等を<b>収納保管口座</b>に預入して管理（移し替え不要）</td></tr></table>",
 warn:"<b>保管口座・収納保管口座の印鑑、預貯金の引出用カード等を管理業者が保管してはならない</b>。ただし管理組合に管理者等が置かれていない場合で、管理者等が選任されるまでの比較的短い期間はこの限りでない。"},
{t:"保証契約", chip:"76条関連",
 body:"<p>イ方式・ロ方式において、管理業者が<b>修繕積立金等金銭を収納口座に預入し、自ら区分所有者等から徴収する</b>場合には、<mark>1月分の修繕積立金等金銭の合計額以上の額につき有効な保証契約</mark>を締結していなければならない。</p><p>保管口座・収納保管口座の印鑑等を管理業者が保管しない等、一定の要件を満たす場合は保証契約が不要となる例外がある。</p>",
 warn:"保証契約は<b>管理組合の資金が横領されるリスクへの備え</b>。「なぜ必要か」から考えると要否の判断がしやすい。"},
{t:"管理事務の報告", chip:"77条", key:true,
 body:"<table class=tbl><tr><th>管理者等が置かれているとき</th><td>事業年度終了後<mark>遅滞なく</mark>、管理事務報告書を作成し<b>管理者等に交付</b>して<b>管理業務主任者に説明させる</b></td></tr><tr><th>管理者等が置かれていないとき</th><td><mark>定期に説明会を開催</mark>し、区分所有者等に管理事務報告書を交付して<b>管理業務主任者に説明させる</b></td></tr></table>",
 warn:"どちらの場合も<b>管理業務主任者による説明が必要</b>。書面交付だけで済ませることはできない。"},
{t:"書類の閲覧・標識の掲示", chip:"79条・71条",
 body:"<p><b>書類の閲覧</b>：管理業者は、<mark>事務所ごとに</mark>、業務及び財産の状況を記載した書類を備え置き、その事務所の営業時間中、管理組合を構成する区分所有者等の求めに応じ閲覧させなければならない。</p><p><b>標識の掲示</b>：事務所ごとに、公衆の見やすい場所に<b>標識</b>を掲げなければならない。</p>"},
{t:"名義貸しの禁止・使用人等の秘密保持", chip:"54条・80条",
 body:"<p>管理業者は、<b>自己の名義をもって他人にマンション管理業を営ませてはならない</b>。</p><p>管理業者及びその使用人その他の従業者は、正当な理由がなく、業務に関して知り得た秘密を漏らしてはならない（<mark>管理業者でなくなった後、従業者でなくなった後も同様</mark>）。</p>"},
{t:"監督処分", chip:"81条〜",
 body:"<table class=tbl><tr><th>指示処分</th><td>業務に関し不正・不誠実な行為をしたとき等</td></tr><tr><th>業務停止命令</th><td><mark>1年以内</mark>の期間を定めて業務の全部又は一部の停止を命ずる</td></tr><tr><th>登録の取消し</th><td>登録拒否事由に該当するに至ったとき、不正の手段により登録を受けたとき、業務停止命令に違反したとき等（<b>必要的取消し</b>の場合がある）</td></tr></table>"},
{t:"マンション管理適正化推進センター", chip:"91条〜",
 body:"<p>国土交通大臣は、管理組合によるマンションの管理の適正化の推進に寄与することを目的とする一般財団法人等を、<b>マンション管理適正化推進センター</b>として指定することができる（公益財団法人マンション管理センターが指定されている）。</p><p>業務：管理に関する情報・資料の収集整理と提供、管理組合の管理者等への技術的支援・研修、調査研究 等。</p>"},
{t:"5問免除制度", chip:"試験制度",
 body:"<p><b>マンション管理士試験の合格者</b>は、管理業務主任者試験において<mark>適正化法に関する5問が免除</mark>される（逆も同様）。</p><p>免除を受ける場合、試験は45問となり、免除された5問は正解として扱われる。</p>"}
],

points:[
{t:"建築基準法の基本用語", chip:"2条", key:true,

{t:"単体規定の主要数値", chip:"居室", hot:"暗記必須", key:true,

{t:"シックハウス対策", chip:"28条の2",
 body:"<p><b>クロルピリホス</b>は居室を有する建築物に使用禁止。</p><p><b>ホルムアルデヒド</b>は、発散速度に応じて内装仕上げの使用面積が制限される（F☆☆☆☆は制限なし）。</p><p>原則として<mark>機械換気設備（24時間換気）</mark>の設置が義務づけられる。住宅の居室の必要換気回数は<mark>0.5回/h以上</mark>。</p>"},
{t:"避難関係規定", chip:"避難",
 body:"<p><b>直通階段</b>：主要構造部が準耐火構造等の共同住宅では、居室の各部分から直通階段までの歩行距離は原則<b>50m以下</b>（主要構造部が耐火構造等の場合の緩和あり）。</p><p><b>2以上の直通階段</b>：一定規模以上の階には2以上の直通階段が必要。</p><p><b>非常用進入口</b>：3階以上の階で高さ31m以下の部分に設置（代替進入口でも可）。</p><p><b>非常用エレベーター</b>：高さ<mark>31mを超える</mark>建築物に設置義務。</p>"},
{t:"定期報告制度", chip:"12条", hot:"頻出", key:true,
 body:"<table class=tbl><tr><th>特定建築物の定期調査</th><td>おおむね<b>6か月〜3年</b>のうち特定行政庁が定める間隔（実務上は3年ごとが多い）。<b>一級建築士・二級建築士・特定建築物調査員</b>が調査</td></tr><tr><th>建築設備・防火設備の定期検査</th><td>おおむね<b>6か月〜1年</b>のうち特定行政庁が定める間隔（実務上は1年ごと）。建築設備検査員等が検査</td></tr></table><p>結果は<b>特定行政庁に報告</b>する。</p>"},
{t:"集団規定の概要", chip:"用途地域等",
 body:"<p><b>容積率</b>：延べ面積の敷地面積に対する割合。前面道路の幅員が12m未満の場合、幅員による制限を受ける。<mark>共同住宅の共用の廊下・階段の床面積は容積率算定の延べ面積に算入しない</mark>。</p><p><b>建蔽率</b>：建築面積の敷地面積に対する割合。角地・防火地域内の耐火建築物等で緩和。</p><p><b>斜線制限</b>：道路斜線・隣地斜線・北側斜線。<b>日影規制</b>。</p>"},
{t:"構造形式", chip:"構造", key:true,
 body:"<table class=tbl><tr><th>ラーメン構造</th><td>柱と梁を剛接合。<b>室内に柱型・梁型が出る</b>が、開口部を大きく取りやすい。中高層に多い</td></tr><tr><th>壁式構造</th><td>耐力壁で支える。<b>柱・梁が室内に出ない</b>が、壁の撤去による間取り変更が難しい。低〜中層に多い</td></tr><tr><th>免震構造</th><td>基礎と建物の間に免震装置を設け、地震動を建物に伝えにくくする</td></tr><tr><th>制震（制振）構造</th><td>建物内にダンパー等を設置し、揺れのエネルギーを吸収する</td></tr></table>",

{t:"耐震基準", chip:"新耐震", hot:"実務直結",
 body:"<p><mark>1981年（昭和56年）6月1日</mark>以降に建築確認を受けたものが<b>新耐震基準</b>。</p><p>新耐震の考え方：中規模の地震（震度5強程度）で<b>ほとんど損傷しない</b>、大規模の地震（震度6強〜7程度）で<b>倒壊・崩壊しない</b>。</p><p><b>Is値</b>（構造耐震指標）が<mark>0.6以上</mark>であれば、大規模地震に対して倒壊・崩壊の危険性が低いとされる。</p>",
 warn:"確認申請日が基準であり、<b>竣工日ではない</b>。1981年竣工でも旧耐震というケースがある。中古売買では要注意。"},
{t:"コンクリートの性質", chip:"材料", hot:"最頻出", key:true,
 body:"<p>コンクリートは<mark>圧縮に強く引張に弱い</mark>。鉄筋は<mark>引張に強い</mark>。両者を組み合わせたのが鉄筋コンクリート（RC）。</p><p>両者は<b>熱膨張率がほぼ等しく</b>、コンクリートのアルカリ性が鉄筋を<b>錆から守る</b>という相性のよさがある。</p><p><b>水セメント比</b>：小さいほど強度・耐久性が高い（水が多いと施工性は上がるが強度は落ちる）。</p><p><b>スランプ値</b>：大きいほど軟らかく施工しやすいが、材料分離を起こしやすい。</p>"},
{t:"中性化とかぶり厚さ", chip:"劣化", key:true,
 body:"<p><b>中性化</b>：空気中の二酸化炭素によりコンクリートのアルカリ性が失われる現象。中性化が鉄筋位置まで達すると<mark>鉄筋が腐食・膨張し、コンクリートを押し割る（爆裂）</mark>。</p><p>判定は<b>フェノールフタレイン溶液</b>を噴霧し、<mark>赤紫色に変色すればアルカリ性（健全）、変色しなければ中性化している</mark>。</p><p><b>かぶり厚さ</b>：鉄筋を覆うコンクリートの厚さ。<b>大きいほど中性化・火災に対して有利</b>。</p>",
 warn:"「変色した部分が中性化している」は<b>逆</b>。赤紫＝健全、無色＝中性化。ここは毎回のように出るひっかけ。"},
{t:"鉄骨造・その他材料", chip:"材料",
 body:"<p><b>鉄骨造（S造）</b>：靱性が高く軽量で大スパンに適するが、<mark>耐火被覆が必要</mark>（鋼材は500℃程度で強度が半減）。錆対策も必要。</p><p><b>SRC造</b>：鉄骨鉄筋コンクリート。RCとSの長所を併せ持ち、高層に適する。</p><p><b>ALC板</b>：軽量気泡コンクリート。軽量・断熱性に優れるが吸水性が高く、防水処理が必要。</p>"},
{t:"遮音と断熱", chip:"性能",
 body:"<p><b>床衝撃音</b>：<mark>LL（軽量床衝撃音）</mark>＝スプーンを落とす等の軽く硬い音、<mark>LH（重量床衝撃音）</mark>＝子どもが跳ぶ等の重く柔らかい音。L値は<b>数値が小さいほど遮音性能が高い</b>。</p><p>重量床衝撃音の低減にはスラブ厚が効く。二重床は施工次第で低音域が悪化することもある。</p><p><b>結露</b>：表面結露と内部結露。断熱材の室内側に<b>防湿層</b>を設けて内部結露を防ぐ。</p>",
 warn:"<b>L値は小さいほど良い</b>（LL-45よりLL-40のほうが高性能）。逆に遮音等級のD値やT値は<b>大きいほど良い</b>。"}
],

 body:"<table class=tbl><tr><th>単相2線式</th><td>100Vのみ。古い建物に見られる</td></tr><tr><th>単相3線式</th><td><mark>100Vと200Vの両方</mark>が使える。現在の住戸の標準。IHクッキングヒーターやエアコンの200V機器に対応</td></tr><tr><th>三相3線式</th><td>200V。<b>エレベーター・ポンプ等の動力用</b></td></tr></table>",
 warn:"単相3線式では<b>中性線が断線すると異常電圧</b>がかかり機器が損傷するおそれがある。中性線を欠相保護する必要がある。"},
{t:"電圧区分と受変電設備", chip:"電気",
 body:"<table class=tbl><tr><th>低圧</th><td>交流<mark>600V以下</mark>（直流750V以下）</td></tr><tr><th>高圧</th><td>600V超〜<mark>7,000V以下</mark></td></tr><tr><th>特別高圧</th><td>7,000V超</td></tr></table><p>契約電力が概ね50kW以上になると<b>高圧受電</b>となり、受変電設備が必要。方式には<b>借室方式・借棟方式・集合住宅用変圧器方式（パッドマウント等）</b>がある。</p>"},
{t:"換気の3方式", chip:"換気", hot:"最頻出", key:true,
 body:"<table class=tbl><tr><th>第1種</th><td>給気・排気とも<b>機械</b>。最も確実に換気量を確保できる。熱交換型換気に多い</td></tr><tr><th>第2種</th><td>給気は機械、排気は自然。室内が<mark>正圧</mark>。<b>クリーンルーム・手術室</b>など汚染空気を入れたくない室</td></tr><tr><th>第3種</th><td>給気は自然、排気は機械。室内が<mark>負圧</mark>。<b>便所・浴室・台所</b>など臭気や湿気を外に出したい室</td></tr></table><p>シックハウス対策として住宅の居室には<b>0.5回/h以上</b>の機械換気設備（24時間換気）が原則必要。</p>",
 warn:"<b>第2種＝正圧＝入れたくない、第3種＝負圧＝出したい</b>。マンション住戸の水回りは第3種が基本。"},
{t:"共同住宅の防火対象物区分", chip:"消防法", key:true,
 body:"<p>共同住宅は消防法上<mark>非特定防火対象物</mark>（令別表第一(5)項ロ）。不特定多数が出入りする特定防火対象物（物販店・飲食店・ホテル等）に比べ規制が緩やか。</p><p><b>防火管理者</b>：共同住宅では<mark>収容人員50人以上</mark>で選任義務が生じる（特定防火対象物は30人以上）。防火管理者は<b>消防計画</b>を作成し、消防長等に届け出る。</p>"},
{t:"消防用設備等の点検と報告", chip:"点検", hot:"最頻出", key:true,
 body:"<table class=tbl><tr><th>機器点検</th><td><mark>6か月ごと</mark></td></tr><tr><th>総合点検</th><td><mark>1年ごと</mark></td></tr><tr><th>報告（特定防火対象物）</th><td>1年に1回</td></tr><tr><th>報告（<b>非特定＝共同住宅</b>）</th><td><mark>3年に1回</mark></td></tr></table>",
 warn:"<b>点検は6か月・1年、報告は共同住宅なら3年に1回</b>。点検周期と報告周期を混同させる出題が定番。"},
{t:"主な消防用設備等の設置基準", chip:"消防設備",
 body:"<table class=tbl><tr><th>屋内消火栓設備</th><td>共同住宅では延べ面積<b>700m²以上</b>（主要構造部が耐火構造で内装制限をすれば3倍の2,100m²以上に緩和）</td></tr><tr><th>スプリンクラー設備</th><td>共同住宅は<mark>11階以上の階</mark>に設置</td></tr><tr><th>連結送水管</th><td>地上<b>7階以上</b>、又は地上5階以上で延べ面積6,000m²以上</td></tr><tr><th>自動火災報知設備</th><td>共同住宅は延べ面積500m²以上等</td></tr><tr><th>住宅用防災警報器</th><td>すべての住宅の寝室・階段等に設置義務</td></tr></table>"},
{t:"避難設備と防火区画", chip:"避難",
 body:"<p><b>バルコニーの隔て板（蹴破り戸）</b>と<b>避難ハッチ</b>は避難経路。<mark>物置や自転車を置いて塞いではならない</mark>。</p><p><b>防火設備</b>：防火戸・防火シャッター。感知器連動で閉鎖する。<b>竪穴区画</b>（階段・エレベーターシャフト）、<b>面積区画</b>、<b>異種用途区画</b>。</p>"},
{t:"エレベーター", chip:"昇降機", key:true,
 body:"<p><b>定期検査報告</b>：建築基準法12条3項に基づき<mark>おおむね1年ごと</mark>に検査し、特定行政庁に報告する。</p><p><b>戸開走行保護装置（UCMP）</b>：戸が開いたまま走行することを防止。<b>地震時管制運転装置</b>：地震の初期微動（P波）を感知して最寄り階に停止させ扉を開く。いずれも一定時期以降の設置が義務化されている。</p><p><b>火災時管制運転</b>、<b>停電時自動着床装置</b>、<b>浸水時管制運転</b>なども普及。</p>"},
{t:"エレベーターの保守契約", chip:"実務",
 body:"<table class=tbl><tr><th>POG契約</th><td>Parts・Oil・Grease。<b>消耗品の交換は含むが、主要部品の取替えは別途費用</b>。月額は安い</td></tr><tr><th>フルメンテナンス契約</th><td>原則として<b>部品の取替え・修理も含む</b>包括契約。月額は高いが突発的な出費が抑えられる</td></tr></table>",
 warn:"フルメンテナンス契約でも、<b>乗場扉・かご室内装・意匠部分・天災による損傷</b>等は対象外とされるのが一般的。"},
{t:"ガス設備", chip:"ガス",
 body:"<p><b>都市ガス</b>は空気より軽い種類が多く、<b>ガス警報器は天井付近</b>に設置。<b>LPガス（プロパン）</b>は空気より重いため<b>床面付近</b>に設置する。</p><p>ガスメーター（マイコンメーター）は、<b>地震（震度5相当以上）・大量流出・長時間使用</b>を検知して自動遮断する。</p>"},
{t:"駐車場設備", chip:"駐車場",
 body:"<p><b>機械式駐車場</b>：二段式・多段式・垂直循環式等。<b>長期修繕計画上の修繕周期は概ね20年</b>とされ、更新費用が管理組合の大きな負担になる。</p><p>危険防止のため、<b>安全対策（安全装置・利用者への周知）</b>が求められる。</p>"}
],

n:18, field:"建築・設備", rev:false,
title:"維持保全 ①",

aim:[

"診断手法は<mark>「何を調べる方法か」をセットで覚える</mark>。フェノールフタレイン＝中性化、自然電位法＝鉄筋腐食、というように1対1で紐づける。",
"<b>建築基準法12条の外壁全面打診（10年ルール）</b>は法令とのクロス論点。管理組合への説明でも必ず出てくる。",

points:[
{t:"修繕周期の目安", chip:"長期修繕計画", hot:"頻出", key:true,
 body:"<table class=tbl><tr><th>外壁塗装・シーリング</th><td>約<mark>12〜15年</mark></td></tr><tr><th>屋上防水（修繕）</th><td>約<mark>12〜15年</mark>（撤去・新設は24〜30年）</td></tr><tr><th>鉄部塗装（屋外）</th><td>約<mark>4〜6年</mark>（屋内は5〜10年）</td></tr><tr><th>給排水管（更生／更新）</th><td>更生15〜20年／更新30〜40年</td></tr><tr><th>玄関ドア・サッシ</th><td>約30〜40年で交換</td></tr><tr><th>機械式駐車場</th><td>約20年</td></tr></table>",
 warn:"大規模修繕工事の周期が<b>おおむね12〜15年</b>とされるのは、外壁塗装・防水・シーリングの周期が重なるため。工事を一度にまとめると足場代を共有できる。"},
{t:"建築基準法12条の外壁全面打診", chip:"法令クロス", key:true,
 body:"<p>特定建築物の定期調査において、<b>タイル張り等の外壁</b>については、<mark>竣工又は外壁改修等から10年を超えた後の最初の調査時</mark>に、<b>手の届く範囲の打診等に加えて、外壁の全面についての打診等</b>を行わなければならない。</p><p>ただし、その調査からおおむね3年以内に外壁改修等が行われることが確実である場合等は除かれる。</p>",
 warn:"「10年ごとに全面打診」ではなく、<b>10年を超えた後の最初の調査時</b>。細かいが出題される。"},
{t:"劣化診断の手法", chip:"診断", hot:"1対1で暗記", key:true,
 body:"<table class=tbl><tr><th>打診調査</th><td><b>テストハンマー</b>で叩き、音の差でタイル・モルタルの<b>浮き</b>を判定</td></tr><tr><th>赤外線調査</th><td>表面温度差から浮きを推定。<b>足場不要</b>だが天候・日射の影響を受ける</td></tr><tr><th>フェノールフタレイン法</th><td><b>中性化深さ</b>の測定（赤紫＝健全）</td></tr><tr><th>シュミットハンマー（反発度法）</th><td>コンクリートの<b>圧縮強度を非破壊で推定</b></td></tr><tr><th>コア採取</th><td>コンクリートを抜き取り<b>圧縮強度試験</b>。破壊試験</td></tr><tr><th>自然電位法</th><td><b>鉄筋の腐食</b>の可能性を推定</td></tr><tr><th>電磁誘導法</th><td><b>かぶり厚さ・鉄筋位置</b>の測定</td></tr></table>"},
{t:"ひび割れの原因と補修工法", chip:"外壁", key:true,
 body:"<p><b>原因</b>：乾燥収縮、温度変化、不同沈下、鉄筋腐食による膨張（爆裂）、アルカリ骨材反応。</p><table class=tbl><tr><th>幅0.2mm未満</th><td><b>シール工法</b>（表面処理）</td></tr><tr><th>幅0.2〜1.0mm程度</th><td><b>樹脂注入工法</b>（自動式低圧注入が主流）</td></tr><tr><th>幅1.0mm超</th><td><b>Uカットシール材充填工法</b>（可とう性エポキシ樹脂等）</td></tr></table>",
 warn:"<b>挙動のあるひび割れ（動くもの）</b>には硬い材料を入れると再度割れる。<b>可とう性（変形追従性）</b>のある材料を選ぶ。"},
{t:"タイルの浮きの補修", chip:"外壁",
 body:"<p><b>アンカーピンニング部分エポキシ樹脂注入工法</b>：浮き部分にアンカーピンを打ち、エポキシ樹脂を注入して固定。</p><p><b>注入口付きアンカーピンニング全面エポキシ樹脂注入工法</b>：注入口を兼ねたピンを一定間隔で打ち込み、面的に固定する。浮きが広範囲の場合に有効。</p><p>タイルが剥落している場合は<b>張替え</b>。既存タイルと同一の製品が入手できないことが多く、色合わせが実務上の課題になる。</p>"},
{t:"防水工法", chip:"防水", key:true,
 body:"<table class=tbl><tr><th>アスファルト防水</th><td>信頼性が高く耐久性に優れる。<b>保護防水</b>（押えコンクリート）と<b>露出防水</b>がある</td></tr><tr><th>改質アスファルトシート防水</th><td><b>トーチ工法</b>（バーナーで炙る）、常温粘着工法。臭気・煙が少ない工法が普及</td></tr><tr><th>合成高分子系シート防水</th><td>塩ビ系・加硫ゴム系。<b>軽量</b>で工期が短い。接合部の施工が要</td></tr><tr><th>ウレタン塗膜防水</th><td>液状のため<mark>複雑な形状にも継ぎ目なく施工できる</mark>。バルコニー・庇に多い</td></tr></table><p><b>かぶせ工法</b>：既存防水層を撤去せずに新規防水層を施工。<b>廃材が少なく工期短縮・居住者への影響が小さい</b>。</p>"},
{t:"シーリング", chip:"シーリング", key:true,
 body:"<p><b>ワーキングジョイント</b>（ムーブメントが大きい目地）は<mark>2面接着</mark>とし、目地底に<b>ボンドブレーカー</b>やバックアップ材を入れて底面での接着を切る。</p><p><b>ノンワーキングジョイント</b>（ひび割れ部等ムーブメントが小さい）は3面接着でもよい。</p><table class=tbl><tr><th>シリコーン系</th><td>耐候性に優れるがほとんど<b>塗装できず</b>、周辺を汚染しやすい。ガラス回り向き</td></tr><tr><th>変成シリコーン系</th><td>塗装可能。外壁目地に広く使われる</td></tr><tr><th>ポリウレタン系</th><td>塗装可能。<b>紫外線に弱い</b>ため露出部には不向き</td></tr></table>",
 warn:"<b>2面接着にするのは、目地の動きに追従させるため</b>。3面接着だと目地が動いたときにシーリングが切れる。"},
{t:"鉄部塗装", chip:"鉄部",
 body:"<p><b>ケレン（素地調整）</b>が塗装の品質を左右する。錆や旧塗膜を除去してから<b>錆止め塗料</b>を塗り、その上に上塗りを行う。</p><p>屋外の鉄部（手すり・階段・扉枠等）は<mark>4〜6年</mark>と修繕周期が短いため、大規模修繕とは別に中間で実施することが多い。</p>"},
{t:"大規模修繕の実施方式", chip:"進め方", key:true,
 body:"<table class=tbl><tr><th>設計監理方式</th><td>設計事務所等が<b>設計・監理</b>を行い、施工会社を別途選定。<b>第三者チェックが働き、仕様と価格の透明性が高い</b>。設計監理費が別途必要</td></tr><tr><th>責任施工方式</th><td>調査・設計から施工まで<b>1社</b>が担う。窓口が一本化されスムーズだが、<b>価格や仕様の妥当性を検証しにくい</b></td></tr><tr><th>管理業者主導（CM）方式</th><td>管理業者がとりまとめる。利害相反に留意が必要</td></tr></table>",
 warn:"近年は<b>設計コンサルタントの不適切な関与</b>（特定業者への誘導等）が問題視され、国交省が注意喚起を行っている。"},
{t:"工事中の留意点", chip:"実務",
 body:"<p><b>仮設足場</b>の設置と防犯対策（開口部の施錠徹底）、<b>近隣・居住者への周知</b>、<b>バルコニーの片付け依頼</b>、洗濯物の制限期間の告知。</p><p><b>アスベスト</b>：吹付け材や成形板を含む建材の除去には、大気汚染防止法・石綿障害予防規則等に基づく事前調査と届出が必要。</p>"}

points:[
{t:"長期修繕計画の基本", chip:"ガイドライン", hot:"頻出", key:true,
 body:"<p><b>計画期間</b>：<mark>30年以上</mark>、かつ<mark>大規模修繕工事が2回以上含まれる期間以上</mark>とする。</p><p><b>見直し</b>：<mark>5年程度ごと</mark>に調査・診断を行い、必要に応じて見直す。大規模修繕工事の直前・直後に行うのが望ましい。</p><p><b>3つの構成</b>：①推定修繕工事項目 ②修繕周期 ③推定修繕工事費（＋収支計画）。</p>",

{t:"推定修繕工事費に含めるもの", chip:"計画",

{t:"修繕積立金の積立方式", chip:"積立", hot:"令和6年改訂", key:true,
 body:"<table class=tbl><tr><th>均等積立方式</th><td>計画期間中の総額を均等に割って毎月積み立てる。<mark>国土交通省が推奨</mark>。将来の負担が読め、値上げの合意形成問題を避けられる</td></tr><tr><th>段階増額積立方式</th><td>当初を低く設定し段階的に引き上げる。<b>販売時の月額を抑えられる</b>ため分譲時に多用されるが、後年の合意形成が難航しやすい</td></tr></table><p><b>令和6年6月改訂ガイドラインの引上げの考え方</b>：均等積立方式とした場合の月額を<b>基準額</b>とし、計画の<mark>初期額は基準額の0.6倍以上</mark>、<mark>最終額は基準額の1.1倍以内</mark>とする。</p>",

{t:"修繕積立金の額の目安", chip:"目安",

{t:"修繕積立金の運用と資金調達", chip:"資金",
 body:"<p><b>マンションすまい・る債</b>（住宅金融支援機構）：管理組合向けの積立債券。安全性が高い運用先として位置づけられる。</p><p><b>借入れ</b>：住宅金融支援機構の<b>共用部分リフォーム融資</b>等。借入れは<b>総会の決議事項</b>。</p><p><b>長寿命化促進税制</b>：一定の要件を満たす大規模修繕工事を行ったマンションについて、翌年度の<b>固定資産税が減額</b>される特例。</p>"},
{t:"耐震診断と耐震改修", chip:"耐震", key:true,
 body:"<p><b>Is値（構造耐震指標）</b>が<mark>0.6以上</mark>であれば、大規模地震に対して倒壊・崩壊の危険性が低いとされる。</p><p><b>耐震改修促進法</b>：旧耐震の既存耐震不適格建築物の所有者は<b>耐震診断・耐震改修の努力義務</b>を負う。要安全確認計画記載建築物等には診断義務がある。</p><p><b>要耐震改修認定建築物</b>の耐震改修は、区分所有法の特例により<mark>集会の過半数の決議</mark>で実施できる。</p>",

{t:"マンション建替え円滑化法", chip:"円滑化法", hot:"混同注意", key:true,
 body:"<p><b>マンション建替組合</b>：建替え合意者の<mark>4分の3以上</mark>の同意を得て、都道府県知事等の認可を受けて設立する法人。<b>権利変換</b>により従前の権利を新建物に移行させる。</p><p><b>要除却認定</b>：特定行政庁が、耐震性不足等の一定の事由に該当するマンションを認定する。認定を受けると<b>容積率の特例</b>等が受けられる。</p><p><b>マンション敷地売却制度</b>：要除却認定を受けたマンションについて、<mark>5分の4以上</mark>の決議により敷地を売却できる。</p>",

 body:"<p><b>①決議の母数が「出席者」へ</b>：<mark>ただし区分所有権の処分を伴う決議は除く</mark>。普通決議（39条）・共用部分の変更（17条）・規約の設定変更廃止（31条）・団地の建替え承認決議（69条）が対象。<b>建替え決議（62条）と再生4決議は全区分所有者が母数のまま</b>。</p><p><b>②定足数の新設</b>：17条・31条には<b>区分所有者の過半数かつ議決権の過半数の出席</b>という定足数が新設された。</p><p><b>③所在等不明区分所有者の除外（38条の2）</b>：裁判所の裁判により、<mark>全ての決議</mark>で議決権を有しないものとされる。</p><p><b>④再生手法の多様化</b>：建物更新（64条の5）・建物敷地売却（64条の6）・建物取壊し敷地売却（64条の7）・取壊し（64条の8）を新設。原則5分の4、耐震性不足等で4分の3。</p><p><b>⑤招集通知</b>：<b>議案の要領</b>の記載が必要になり、1週間の期間は<b>伸長のみ</b>可能に。</p><p><b>⑥管理不全への対応</b>：所有者不明専有部分管理命令（46条の2）、管理不全専有部分管理命令（46条の8）、管理不全共用部分管理命令（46条の13）。国内管理人（6条の2）も新設。</p><p><b>⑦建替え等に伴う賃借人対応</b>：賃貸借の終了請求（64条の2）、請求から6か月で終了、補償金の支払い。</p><p><b>⑧管理計画認定制度の拡充</b>：新築時に分譲事業者が申請可能に。</p><p><b>⑨標準管理規約</b>：令和7年10月17日改正で上記に対応。</p>",
 warn:"試験は<b>実施年の4月1日時点で施行されている法令</b>に基づいて出題される。改正法は2026年4月1日施行済みのため、<mark>2026年度試験は改正法ベース</mark>。"},

{t:"直前1週間の過ごし方", chip:"本番対策",
 body:"<p><b>①新しい教材に手を出さない</b>。この20週分と過去問の復習に絞る。</p><p><b>②数字の表だけを毎日1回眺める</b>。上の3つの表を印刷して持ち歩くのが効率的。</p><p><b>③解く順番を決めておく</b>。得意分野（適正化法・委託契約書・会計）から先に処理し、建築設備の細かい問題は後回しにする。</p><p><b>④分からない問題は飛ばす</b>。50問を約2時間（120分）で解くので、1問あたり約2分。悩む問題に5分かけると他が崩れる。</p><p><b>⑤マークシートのずれ確認</b>を必ず途中で1回入れる。</p>",
 warn:"合格ラインは例年<b>33〜37点前後</b>。<mark>7割取れれば十分に射程圏</mark>。満点主義を捨てることが最大の戦略。"},

{t:"都市計画法の骨格", chip:"都市計画法",
 body:"<p><b>都市計画区域</b>を定め、必要に応じて<b>区域区分</b>（市街化区域／市街化調整区域）を行う。区域区分をしない区域を<b>非線引き区域</b>という。</p><p><b>用途地域</b>は13種類（第一種低層住居専用地域〜工業専用地域、田園住居地域を含む）。<mark>市街化区域には必ず用途地域を定める</mark>／市街化調整区域には原則として定めない。</p><table class=tbl><tr><th colspan=2>開発許可が必要となる規模（原則）</th></tr><tr><td>市街化区域</td><td><b>1,000m²以上</b></td></tr><tr><td>市街化調整区域</td><td><b>規模にかかわらず原則必要</b></td></tr><tr><td>非線引き区域・準都市計画区域</td><td>3,000m²以上</td></tr><tr><td>都市計画区域外・準都市計画区域外</td><td>10,000m²以上</td></tr></table>"},
{t:"建蔽率・容積率の緩和と算入除外", chip:"集団規定", hot:"頻出", key:true,
 body:"<p><b>建蔽率の緩和</b>：特定行政庁が指定する<b>角地</b>で＋10%、<b>防火地域内の耐火建築物等</b>で＋10%（両方該当なら＋20%）。<mark>建蔽率80%の地域内かつ防火地域内の耐火建築物は制限なし（100%）</mark>。</p><p><b>容積率</b>：前面道路の幅員が12m未満の場合、<b>幅員×4/10（住居系）または×6/10（その他）</b>と指定容積率のうち<b>小さい方</b>が限度となる。</p><p><mark>共同住宅の共用の廊下・階段の床面積は、容積率算定上の延べ面積に算入しない</mark>。昇降機の昇降路部分も同様。</p>",
 warn:"共用廊下・階段の不算入は、マンションの容積計算で必ず出てくる実務論点。「専有部分だけでなく共用部分も全部算入する」は誤り。"},
{t:"斜線制限・日影規制・防火地域", chip:"集団規定",
 body:"<table class=tbl><tr><th>道路斜線</th><td>すべての用途地域等に適用</td></tr><tr><th>隣地斜線</th><td><mark>第一種・第二種低層住居専用地域、田園住居地域には適用されない</mark>（絶対高さ制限があるため）</td></tr><tr><th>北側斜線</th><td>低層住居専用地域・中高層住居専用地域・田園住居地域に適用</td></tr><tr><th>日影規制</th><td><mark>商業地域・工業地域・工業専用地域には適用されない</mark></td></tr></table><p><b>防火地域</b>：階数3以上又は延べ面積100m²超は耐火建築物等。<b>準防火地域</b>：地上4階以上又は延べ面積1,500m²超は耐火建築物等。</p>",
 warn:"「低層住専に隣地斜線がない」「商業・工業系に日影規制がない」の2つは、<b>適用されない</b>ほうを覚えるのがコツ。"},
{t:"標準管理規約 団地型（単棟型との差分）", chip:"団地型", hot:"差分だけ", key:true,
 body:"<p><b>団地管理組合</b>：団地内の全建物の区分所有者全員で構成する。各棟にも棟別の管理組合が観念される。</p><p><b>費用は3本立て</b>：<mark>管理費／団地修繕積立金／各棟修繕積立金</mark>。各棟修繕積立金は<b>棟ごとに区分して経理</b>する。</p><p><b>棟総会</b>：区分所有法上、各棟でしか決議できない事項は棟総会で決議する。具体的には<b>①建替え決議 ②義務違反者への措置（使用禁止・競売・引渡し請求）③各棟の共用部分の変更 ④各棟の規約の設定変更廃止 ⑤大規模滅失の復旧</b>など。</p>",
 warn:"<b>建替え決議は団地総会ではなく棟総会</b>（一括建替え決議を除く）。団地総会で何でも決められるわけではない。"},
{t:"標準管理規約 複合用途型（単棟型との差分）", chip:"複合用途型", key:true,
 body:"<p>住宅部分と店舗部分が混在するマンション用。共用部分が<b>3種類</b>になる。</p><table class=tbl><tr><th>全体共用部分</th><td>エントランス・外壁・屋上等、全員が使うもの</td></tr><tr><th>住宅一部共用部分</th><td>住宅部分の廊下・階段等</td></tr><tr><th>店舗一部共用部分</th><td>店舗部分の共用部分</td></tr></table><p>これに対応して、<b>管理費も修繕積立金も「全体／住宅一部／店舗一部」の3本立て</b>になる。</p><p>店舗部分の区分所有者は、<b>店舗前面のスペース等について専用使用権</b>を有し、使用料を納入する。</p>"},
{t:"所有者不明土地・建物管理制度", chip:"民法（令和3年改正）", key:true,
 body:"<p>裁判所は、<b>利害関係人の請求</b>により、所有者を知ることができず又はその所在を知ることができない土地・建物について、<mark>所有者不明土地（建物）管理命令</mark>を発し、管理人を選任することができる。</p><p>また、所有者はいるが管理が不適当で他人の権利等が侵害されるおそれがある場合には、<mark>管理不全土地（建物）管理命令</mark>を発することができる。</p>",
 warn:"<b>2026年改正との接続</b>：これらの民法上の制度は<b>区分所有建物の専有部分・共用部分には適用されない</b>ため、2026年施行の改正区分所有法で<b>マンション専用の財産管理制度</b>が別途新設された。「民法の制度でマンションにも対応できる」は誤り。"},
{t:"相隣関係の令和3年改正", chip:"民法",
 body:"<p><b>隣地使用権</b>：境界付近の建物の築造・修繕等のため<b>必要な範囲で隣地を使用できる</b>（原則としてあらかじめ通知が必要。住家に立ち入るには居住者の承諾が必要）。</p><p><b>竹木の枝の切除</b>：原則は所有者に切除させるが、<mark>①催告しても相当期間内に切除しない ②所有者を知ることができない・所在が不明 ③急迫の事情がある</mark> ときは、<b>自ら切除できる</b>。<b>根は従来どおり自ら切り取れる</b>。</p><p><b>ライフライン設備の設置・使用権</b>：他人の土地・設備を使用しなければ電気・ガス・水道等の供給を受けられない場合、必要な範囲で設置・使用できる。</p>",
 warn:"<b>枝は原則ダメ（例外的に可）、根はOK</b>。この非対称が出題の急所。"},
{t:"第三者管理者方式（外部管理者方式）", chip:"政策トピック", hot:"要注意", key:true,
 body:"<p>役員のなり手不足を背景に、<b>管理業者やマンション管理士等の外部専門家が管理者に就任する方式</b>が広がっている。</p><p>国土交通省は、<b>マンション管理業者が管理者となる場合のガイドライン</b>を公表し、次の点への対応を求めている。</p><table class=tbl><tr><th>利益相反</th><td>自社への工事発注等について、区分所有者への説明・相見積り・総会承認等の手続</td></tr><tr><th>財産の管理</th><td>管理者と管理業者が同一であるため、<b>通帳と印鑑の分離、監事や区分所有者による牽制</b>が重要</td></tr><tr><th>情報開示</th><td>区分所有者への定期的な報告・帳票の開示</td></tr><tr><th>解任手続</th><td>区分所有者がいつでも解任できる手続の確保</td></tr></table>",
 warn:"標準管理規約にも、<b>外部専門家を役員として選任できるようにする場合</b>の規定例が示されている。「役員は必ず組合員でなければならない」は、この規定例を採用した場合には当てはまらない。"},
{t:"不動産登記法（区分建物の補足）", chip:"登記",
 body:"<p><b>表題登記</b>：区分建物の表題登記は、<mark>一棟の建物に属する他の区分建物と併せて申請</mark>しなければならない。</p><p><b>原始取得者からの取得</b>：分譲業者（原始取得者）から専有部分を取得した者は、<b>直接自己名義で表題登記を申請することができる</b>。</p><p><b>敷地権</b>：分離処分できない敷地利用権は敷地権として登記され、以後、専有部分についての登記が敷地権にも及ぶ。</p><p><b>規約共用部分</b>：表題部にその旨が記録される。所有権の登記があるときはこれを抹消する。</p>"},
{t:"統計とマンションストックの現状", chip:"統計",
 body:"<p><b>マンションストック</b>：全国でおおむね<b>700万戸前後</b>（令和5年末時点の国土交通省推計で約704万戸）。居住人口は<b>1,500万人程度</b>と推計される。</p><p><b>築40年以上のマンション</b>：令和5年末でおおむね<b>137万戸</b>。10年後・20年後には大幅に増加すると推計されている。</p><p><b>マンション総合調査</b>：国土交通省がおおむね<mark>5年ごと</mark>に実施。管理組合の運営実態、修繕積立金の水準、役員のなり手不足などが公表される。</p>",
 warn:"数値は調査年により更新されるため、<b>正確な数字よりも「二つの老い（建物の老い・居住者の老い）」という構図</b>を理解しておくこと。政策（管理計画認定・決議要件緩和・再生手法の多様化）はすべてここから来ている。"}
],

/* ===== 定数 ===== */
var EXAM = new Date(2026, 11, 6); // 2026-12-06
var FIELDS = {
  "区分所有法":   {c:"#27386B", w:"#EDF1F8"},
  "標準管理規約": {c:"#2F6B5E", w:"#E9F2EF"},
  "委託契約書":   {c:"#5B4B8A", w:"#EFECF6"},
  "民法・法令":   {c:"#8A5A2B", w:"#F5EEE5"},
  "適正化法":     {c:"#A3452F", w:"#F8ECE8"},
  "会計・税務":   {c:"#8A6E10", w:"#F6F1DF"},
  "建築・設備":   {c:"#2C6E8F", w:"#E8F1F6"},
  "総まとめ":     {c:"#7A2E3C", w:"#F6EAEC"},
  "補講":         {c:"#4A5B33", w:"#EDF2E6"}
};
function fc(f){ return (FIELDS[f]||FIELDS["区分所有法"]).c; }
function fw(f){ return (FIELDS[f]||FIELDS["区分所有法"]).w; }

var app = document.getElementById("app");

/* ===== 進捗（window.storage、失敗時はメモリ） ===== */
var P = {};
var KEY = "kangyo2026-progress";
var saveTimer = null;

function hasRecord(o){
  if(!o) return false;
  for(var k in o){ if(o.hasOwnProperty(k) && k !== "meta") return true; }
  return false;
}
function readLocal(){
  try{
    var s = window.localStorage ? localStorage.getItem(KEY) : null;
    if(s){ var o = JSON.parse(s); if(o && typeof o === "object") P = o; }
  }catch(e){}
}
function writeLocal(){
  try{ if(window.localStorage) localStorage.setItem(KEY, JSON.stringify(P)); }catch(e){}
}
function loadProgress(){
  return new Promise(function(res){
    try{
      if(window.storage && window.storage.get){
        window.storage.get(KEY).then(function(r){
          try{ if(r && r.value) P = JSON.parse(r.value); }catch(e){}
          if(!hasRecord(P)) readLocal();
          res();
        })["catch"](function(){ readLocal(); res(); });
        return;
      }
    }catch(e){}
    readLocal();
    res();
  });
}
function saveProgress(){
  clearTimeout(saveTimer);
  var d = new Date();
  P.meta = { last: ("0"+(d.getMonth()+1)).slice(-2) + "/" + ("0"+d.getDate()).slice(-2) };
  saveTimer = setTimeout(function(){
    writeLocal();
    try{
      if(window.storage && window.storage.set){
        window.storage.set(KEY, JSON.stringify(P))["catch"](function(){});
      }
    }catch(e){}
  }, 400);
}
function lastStudied(){
  return (P.meta && P.meta.last) ? P.meta.last : "–";
}
function wkStat(w){
  var total = w.ox.length + w.mc.length;
  var rec = P["w"+w.n] || {};
  var done = 0, ok = 0;
  for(var k in rec){ if(rec.hasOwnProperty(k) && k.indexOf("p_") !== 0){ done++; if(rec[k]) ok++; } }
  return {total:total, done:done, ok:ok, pct: total ? Math.round(done/total*100) : 0};
}

/* ===== カウントダウン ===== */
function days(){
  var now = new Date();
  var t = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.max(0, Math.round((EXAM - t) / 86400000));
}
document.getElementById("cd").textContent = days();

/* ===== ホーム ===== */
function renderHome(){
  var totalQ = 0, totalDone = 0, totalOk = 0;
  WEEKS.forEach(function(w){ var s = wkStat(w); totalQ += s.total; totalDone += s.done; totalOk += s.ok; });
  var rate = totalDone ? Math.round(totalOk/totalDone*100) : 0;

  var cards = WEEKS.map(function(w){
    var s = wkStat(w);
    return "<button class='wk' data-w='"+w.n+"' style='border-left-color:"+fc(w.field)+"'>"
      + (s.done ? "<span class='pct'>"+s.pct+"%</span>" : "")
      + "<div class='r1'><span class='num'>WEEK "+("0"+w.n).slice(-2)+"</span>"
      + "<span class='fld' style='color:"+fc(w.field)+";background:"+fw(w.field)+"'>"+w.field+"</span>"
      + (w.rev ? "<span class='rev'>改正</span>" : "")
      + "</div>"
      + "<div class='ttl'>"+w.title+"</div>"
      + "<div class='sub'>"+w.sub+"</div>"
      + "<div class='pb'><i style='width:"+s.pct+"%'></i></div>"
      + "</button>";
  }).join("");

  app.innerHTML =
  "<div class='hero'>"
  + "<p class='eyebrow'>KANRI GYOMU SHUNINSHA ／ 2026</p>"
  + "<h1>管理業務主任者<br>22週間 合格プログラム<span class='sub'>2026年12月6日（日）本試験／改正区分所有法 完全対応</span></h1>"
  + "<p class='hero-lede'>区分所有法から建築設備まで、本試験の全範囲を22週に分割した学習サイトです。各週に「今週の狙い → 要点インプット → 演習（即時採点）→ 暗記カード」を用意しています。解答状況は自動的に記録されます。</p>"
  + "<div class='stats'>"
  + "<div class='stat hot'><div class='k'>本試験まで</div><div class='v'>"+days()+"<small> 日</small></div></div>"
  + "<div class='stat'><div class='k'>収録週</div><div class='v'>"+WEEKS.length+"<small> 週</small></div></div>"
  + "<div class='stat'><div class='k'>収録問題</div><div class='v'>"+totalQ+"<small> 問</small></div></div>"
  + "<div class='stat'><div class='k'>解答済</div><div class='v'>"+totalDone+"<small> 問</small></div></div>"
  + "<div class='stat'><div class='k'>正答率</div><div class='v'>"+(totalDone?rate:"–")+"<small> %</small></div></div>"
  + "<div class='stat'><div class='k'>最終学習日</div><div class='v' style='font-size:26px'>"+lastStudied()+"</div></div>"
  + "</div></div>"

/* ===== 週ページ ===== */
function renderWeek(n){
  var w = null;
  for(var i=0;i<WEEKS.length;i++){ if(WEEKS[i].n === n){ w = WEEKS[i]; break; } }
  if(!w){ renderHome(); return; }

  var rec = P["w"+n] || {};
  var col = fc(w.field), wash = fw(w.field);

  var aim = "<ul class='aim'>" + w.aim.map(function(a){
    return "<li style='border-left-color:"+col+"'>"+a+"</li>";
  }).join("") + "</ul>";

  var arts = "<div class='arts'>" + w.points.map(function(p,i){
    return "<div class='art"+(p.key?" key":"")+"'>"
      + "<div class='art-head'><span class='no'>"+("0"+(i+1)).slice(-2)+"</span>"
      + "<span class='art-title'>"+p.t+"</span>"
      + (p.chip ? "<span class='chip' style='color:"+col+";background:"+wash+"'>"+p.chip+"</span>" : "")
      + (p.hot ? "<span class='chip shu'>"+p.hot+"</span>" : "")
      + "</div>"
      + (p.body||"")
      + (p.warn ? "<div class='warn'>"+p.warn+"</div>" : "")
      + "</div>";
  }).join("") + "</div>";

  var qn = 0;
  var oxq = w.ox.map(function(q,i){
    qn++;
    var id = "ox"+i, ans = rec[id], has = rec.hasOwnProperty(id);
    var picked = has ? (ans ? q.a : !q.a) : null; // 正解ならa、不正解なら逆
    function bcls(v){
      if(!has) return "";
      if(v === q.a) return " correct";
      if(v === picked) return " wrong";
      return " dim";
    }
    return "<div class='q"+(has?" done":"")+"' data-q='"+id+"' data-a='"+(q.a?1:0)+"' data-t='ox'>"
      + "<div class='q-head'><span class='q-no'>"+("0"+qn).slice(-2)+"</span><span class='q-text'>"+q.q+"</span></div>"
      + "<div class='ox'><button data-v='1' class='"+bcls(true).trim()+"'>◯</button><button data-v='0' class='"+bcls(false).trim()+"'>×</button></div>"
      + "<div class='verdict'><div class='verdict-head'>"
      + "<span class='badge "+(ans?"ok":"ng")+"'>"+(ans?"正解":"不正解")+"</span>"
      + "<span class='ans'>答："+(q.a?"◯":"×")+"</span></div>"
      + "<div class='exp'>"+q.e+"</div></div></div>";
  }).join("");

  var mcq = w.mc.map(function(q,i){
    qn++;
    var id = "mc"+i, ans = rec[id], has = rec.hasOwnProperty(id);
    var pick = has ? (rec["p_"+id] || (ans ? q.a : 0)) : 0;
    var ch = q.c.map(function(c,j){
      var v = j+1, cls = "";
      if(has){ cls = (v === q.a) ? " correct" : (v === pick ? " wrong" : " dim"); }
      return "<button data-v='"+v+"' class='"+cls.trim()+"'><span class='n'>"+v+"</span><span>"+c+"</span></button>";
    }).join("");
    return "<div class='q"+(has?" done":"")+"' data-q='"+id+"' data-a='"+q.a+"' data-t='mc'>"
      + "<div class='q-head'><span class='q-no mc'>"+("0"+qn).slice(-2)+"</span><span class='q-text'>"+q.stem+"</span></div>"
      + "<div class='choices'>"+ch+"</div>"
      + "<div class='verdict'><div class='verdict-head'>"
      + "<span class='badge "+(ans?"ok":"ng")+"'>"+(ans?"正解":"不正解")+"</span>"
      + "<span class='ans'>正解："+q.a+"</span></div>"
      + "<div class='exp'>"+q.e+"</div></div></div>";
  }).join("");

  var cards = "<div class='cards'>" + w.cards.map(function(c,i){
    return "<div class='fc' data-fc='"+i+"' tabindex='0'>"
      + "<div class='lbl'>Q "+(i+1)+"</div><div class='txt' data-q=\"" + c.q.replace(/"/g,"&quot;") + "\" data-a=\"" + c.a.replace(/"/g,"&quot;") + "\">"+c.q+"</div></div>";
  }).join("") + "</div>";

  var prev = null, next = null;
  WEEKS.forEach(function(x){ if(x.n === n-1) prev = x; if(x.n === n+1) next = x; });

  app.innerHTML =
  "<div class='wk-head'>"
  + "<div class='kicker'><span class='crumb'>WEEK "+("0"+n).slice(-2)+" / "+WEEKS.length+"</span>"
  + "<span class='badge-fld' style='color:"+col+";background:"+wash+"'>"+w.field+"</span>"
  + (w.rev ? "<span class='rev' style='margin:0'>2026年改正 関連</span>" : "")
  + "</div>"
  + "<h1>"+w.title+"<span class='sub'>"+w.sub+"</span></h1></div>"

  + "<section><h2>今週の狙い</h2><div style='margin-top:18px'>"+aim+"</div></section>"
  + "<section><h2>要点インプット</h2><p class='hint'>朱色の縦線が入った項目は特に重要です。赤い枠は、実際に間違えやすいポイントです。</p>"+arts+"</section>"

  + "<section><h2>演習</h2>"
  + "<div class='progress'><span>進捗</span><div class='bar'><i id='pbar'></i></div><span class='score' id='score'>0 / "+qn+"</span></div>"
  + "<h3 class='sub-h'>正誤問題</h3>"+oxq
  + "<h3 class='sub-h'>四肢択一</h3>"+mcq
  + "<div class='result' id='result'></div>"
  + "<div class='btnrow'><button class='btn' id='resetW'>この週の解答をリセット</button></div>"
  + "</section>"

  + "<section><h2>暗記カード</h2><p class='hint'>タップすると答えが表示されます。移動中の確認用です。</p>"+cards+"</section>"

  + "<div class='pager'>"
  + (prev ? "<button data-w='"+prev.n+"'><div class='d'>← 前の週</div><div class='t'>第"+prev.n+"週　"+prev.title+"</div></button>"
          : "<button disabled><div class='d'>← 前の週</div><div class='t'>—</div></button>")
  + (next ? "<button data-w='"+next.n+"' class='nx'><div class='d'>次の週 →</div><div class='t'>第"+next.n+"週　"+next.title+"</div></button>"
          : "<button data-w='home' class='nx'><div class='d'>次へ →</div><div class='t'>週一覧へ戻る</div></button>")
  + "</div>"

  + "<footer>WEEK "+n+" ／ "+w.title+"<br>条番号や数値は改正により変動することがあります。最終確認は最新の条文・国土交通省資料で。</footer>";

  updateScore(n, qn);
  window.scrollTo(0,0);
}

/* ===== 採点表示 ===== */
function updateScore(n, total){
  var rec = P["w"+n] || {};
  var done = 0, ok = 0;
  for(var k in rec){ if(rec.hasOwnProperty(k) && k.indexOf("p_") !== 0){ done++; if(rec[k]) ok++; } }
  var bar = document.getElementById("pbar"), sc = document.getElementById("score");
  if(bar) bar.style.width = (total ? done/total*100 : 0) + "%";
  if(sc) sc.textContent = ok + " / " + total + (done < total ? "（解答 "+done+"問）" : "");
  var res = document.getElementById("result");
  if(res && done >= total && total > 0){
    var r = Math.round(ok/total*100);
    var cmt = r >= 90 ? "本試験でも取り切れる水準です。この週は仕上がっています。"
            : r >= 70 ? "合格ラインは超えています。間違えた問題の解説だけ読み直しましょう。"
            : r >= 50 ? "もう一歩。要点インプットに戻って、赤枠の注意書きを重点的に確認してください。"
            : "この週は再学習が必要です。要点を読み直してから、もう一度解いてみてください。";
    res.className = "result show";
    res.innerHTML = "<div class='big'>"+ok+" / "+total+"　（"+r+"%）</div><div class='cmt'>"+cmt+"</div>";
  }
}

/* ===== イベント ===== */
document.addEventListener("click", function(e){
  var t = e.target;

  var wkBtn = t.closest ? t.closest("[data-w]") : null;
  if(wkBtn && wkBtn.hasAttribute("data-w")){
    var v = wkBtn.getAttribute("data-w");
    location.hash = (v === "home") ? "#home" : "#w"+v;
    return;
  }

  var fc0 = t.closest ? t.closest(".fc") : null;
  if(fc0){
    var txt = fc0.querySelector(".txt");
    var flip = fc0.classList.toggle("flip");
    txt.textContent = flip ? txt.getAttribute("data-a") : txt.getAttribute("data-q");
    fc0.querySelector(".lbl").textContent = flip ? "ANSWER" : "Q "+(parseInt(fc0.getAttribute("data-fc"),10)+1);
    return;
  }

  if(t.id === "resetW"){
    var m = location.hash.match(/^#w(\d+)$/);
    if(m){ delete P["w"+parseInt(m[1],10)]; saveProgress(); renderWeek(parseInt(m[1],10)); }
    return;
  }

  var btn = t.closest ? t.closest(".ox button, .choices button") : null;
  if(!btn) return;
  var q = btn.closest(".q");
  if(!q || q.classList.contains("done")) return;

  var m2 = location.hash.match(/^#w(\d+)$/);
  var wn = m2 ? parseInt(m2[1],10) : 1;
  var id = q.getAttribute("data-q");
  var correct = q.getAttribute("data-a");
  var picked = btn.getAttribute("data-v");
  var isOk = (picked === correct);

  if(!P["w"+wn]) P["w"+wn] = {};
  P["w"+wn][id] = isOk;
  if(q.getAttribute("data-t") === "mc") P["w"+wn]["p_"+id] = parseInt(picked,10);
  saveProgress();

  var btns = q.querySelectorAll("button");
  for(var i=0;i<btns.length;i++){
    var v = btns[i].getAttribute("data-v");
    if(v === correct) btns[i].classList.add("correct");
    else if(v === picked) btns[i].classList.add("wrong");
    else btns[i].classList.add("dim");
  }
  var bd = q.querySelector(".badge");
  if(bd){ bd.className = "badge " + (isOk ? "ok" : "ng"); bd.textContent = isOk ? "正解" : "不正解"; }
  q.classList.add("done");

  var totalQ = document.querySelectorAll(".q").length;
  updateScore(wn, totalQ);
});

document.addEventListener("keydown", function(e){
  if(e.key === "Enter" || e.key === " "){
    var el = document.activeElement;
    if(el && el.classList && el.classList.contains("fc")){ e.preventDefault(); el.click(); }
  }
});

document.getElementById("brandBtn").addEventListener("click", function(){ location.hash = "#home"; });
document.getElementById("navHome").addEventListener("click", function(){ location.hash = "#home"; });

/* ===== ルーティング ===== */
function route(){
  var h = location.hash;
  var m = h.match(/^#w(\d+)$/);
  if(m) renderWeek(parseInt(m[1],10));
  else renderHome();
}
window.addEventListener("hashchange", route);

WEEKS.sort(function(a,b){ return a.n - b.n; });
loadProgress().then(route);
</script>
